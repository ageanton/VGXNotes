name: Build VDX Player APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vdx-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b682569dd4e08acf67170a2b42d829\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a578e44e3bb4530a66d34b880fb" > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Project Structure, Fonts, Gradle Configs & Source Code
        run: |
          set -e
          mkdir -p app/src/main/java/com/flagship/videoplayer/data
          mkdir -p app/src/main/java/com/flagship/videoplayer/ui/theme
          mkdir -p app/src/main/java/com/flagship/videoplayer/ui/home
          mkdir -p app/src/main/java/com/flagship/videoplayer/ui/player
          mkdir -p app/src/main/java/com/flagship/videoplayer/engine
          mkdir -p app/src/main/res/font
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          sudo apt-get update -y && sudo apt-get install -y fonts-dejavu-core fonts-liberation2 curl file

          download_or_fallback_font() {
            local url="$1"
            local dest="$2"
            local fallback="$3"
            curl -sL --retry 3 --connect-timeout 10 "$url" -o "$dest" || true
            if [ ! -s "$dest" ] || ! file "$dest" | grep -qiE "font|TrueType|OpenType"; then
              cp "$fallback" "$dest"
            fi
          }

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" \
            "app/src/main/res/font/inter_regular.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" \
            "app/src/main/res/font/inter_medium.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" \
            "app/src/main/res/font/inter_bold.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf" \
            "app/src/main/res/font/space_grotesk_medium.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf" \
            "app/src/main/res/font/space_grotesk_bold.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/spacemono/SpaceMono-Regular.ttf" \
            "app/src/main/res/font/space_mono_regular.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/spacemono/SpaceMono-Bold.ttf" \
            "app/src/main/res/font/space_mono_bold.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/plusjakartasans/PlusJakartaSans%5Bwght%5D.ttf" \
            "app/src/main/res/font/plus_jakarta_sans.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/opensans/OpenSans%5Bwdth,wght%5D.ttf" \
            "app/src/main/res/font/open_sans.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/dmsans/DMSans%5Bopsz,wght%5D.ttf" \
            "app/src/main/res/font/dm_sans.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VDXPlayer"
          include(":app")
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("com.google.devtools.ksp") version "2.0.21-1.0.27" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "com.flagship.videoplayer"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.flagship.videoplayer"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 420
                  versionName = "4.2.0-VDX"

                  vectorDrawables {
                      useSupportLibrary = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
                  debug {
                      applicationIdSuffix = ".debug"
                      versionNameSuffix = "-VDX"
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += listOf(
                      "-opt-in=androidx.media3.common.util.UnstableApi",
                      "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                      "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi",
                      "-opt-in=androidx.compose.animation.ExperimentalAnimationApi"
                  )
              }

              buildFeatures {
                  compose = true
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")

              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.documentfile:documentfile:1.0.1")

              val media3Version = "1.5.0"
              implementation("androidx.media3:media3-exoplayer:$media3Version")
              implementation("androidx.media3:media3-exoplayer-hls:$media3Version")
              implementation("androidx.media3:media3-exoplayer-dash:$media3Version")
              implementation("androidx.media3:media3-exoplayer-smoothstreaming:$media3Version")
              implementation("androidx.media3:media3-exoplayer-rtsp:$media3Version")
              implementation("androidx.media3:media3-datasource-okhttp:$media3Version")
              implementation("androidx.media3:media3-ui:$media3Version")
              implementation("androidx.media3:media3-session:$media3Version")
              implementation("androidx.media3:media3-common:$media3Version")
              implementation("org.jellyfin.media3:media3-ffmpeg-decoder:1.5.0+1")

              implementation("com.squareup.okhttp3:okhttp:4.12.0")

              val roomVersion = "2.6.1"
              implementation("androidx.room:room-runtime:$roomVersion")
              implementation("androidx.room:room-ktx:$roomVersion")
              ksp("androidx.room:room-compiler:$roomVersion")

              implementation("androidx.datastore:datastore-preferences:1.1.1")
              implementation("androidx.palette:palette-ktx:1.0.0")
              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("io.coil-kt:coil-video:2.7.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.FlagshipVideoPlayer" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          EOF

          # Generate 5 Round Launcher Icon Variants for Dynamic App Icon Color Switching
          cat << 'EOF' > app/src/main/res/drawable/ic_vdx_blue.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#111111" android:pathData="M54,4 A50,50 0 1,1 53.9,4 Z"/>
              <path android:fillColor="#4D9CFF" android:pathData="M54,10 A44,44 0 1,1 53.9,10 Z"/>
              <path android:fillColor="#111111" android:pathData="M43,34 L77,54 L43,74 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M40,31 L74,51 L40,71 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_vdx_emerald.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0F1E16" android:pathData="M54,4 A50,50 0 1,1 53.9,4 Z"/>
              <path android:fillColor="#10B981" android:pathData="M54,10 A44,44 0 1,1 53.9,10 Z"/>
              <path android:fillColor="#0F1E16" android:pathData="M43,34 L77,54 L43,74 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M40,31 L74,51 L40,71 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_vdx_gold.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#111111" android:pathData="M54,4 A50,50 0 1,1 53.9,4 Z"/>
              <path android:fillColor="#FFD83D" android:pathData="M54,10 A44,44 0 1,1 53.9,10 Z"/>
              <path android:fillColor="#111111" android:pathData="M43,34 L77,54 L43,74 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M40,31 L74,51 L40,71 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_vdx_violet.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#171324" android:pathData="M54,4 A50,50 0 1,1 53.9,4 Z"/>
              <path android:fillColor="#A78BFA" android:pathData="M54,10 A44,44 0 1,1 53.9,10 Z"/>
              <path android:fillColor="#171324" android:pathData="M43,34 L77,54 L43,74 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M40,31 L74,51 L40,71 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_vdx_onyx.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#5CE1E6" android:pathData="M54,4 A50,50 0 1,1 53.9,4 Z"/>
              <path android:fillColor="#16181E" android:pathData="M54,10 A44,44 0 1,1 53.9,10 Z"/>
              <path android:fillColor="#000000" android:pathData="M43,34 L77,54 L43,74 Z"/>
              <path android:fillColor="#5CE1E6" android:pathData="M40,31 L74,51 L40,71 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path name="external_files" path="." />
              <files-path name="internal_files" path="." />
          </paths>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_vdx_blue"
                  android:roundIcon="@drawable/ic_vdx_blue"
                  android:label="VDX Player"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:largeHeap="true"
                  android:theme="@style/Theme.FlagshipVideoPlayer">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:supportsPictureInPicture="true"
                      android:launchMode="singleTask"
                      android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="content" />
                          <data android:scheme="file" />
                          <data android:mimeType="video/*" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" />
                          <data android:scheme="https" />
                          <data android:scheme="rtsp" />
                          <data android:mimeType="video/*" />
                          <data android:mimeType="application/vnd.apple.mpegurl" />
                          <data android:mimeType="application/x-mpegurl" />
                          <data android:mimeType="application/dash+xml" />
                      </intent-filter>
                  </activity>

                  <!-- Activity Aliases for Dynamic App Icon Color Switching -->
                  <activity-alias
                      android:name=".LauncherBlue"
                      android:enabled="true"
                      android:exported="true"
                      android:icon="@drawable/ic_vdx_blue"
                      android:roundIcon="@drawable/ic_vdx_blue"
                      android:label="VDX Player"
                      android:targetActivity=".MainActivity">
                      <intent-filter>
