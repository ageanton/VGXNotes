                                  LibraryViewMode.RICH_LIST -> folderContentViewMode == FolderContentViewMode.RICH_LIST
                                  LibraryViewMode.COMFORT_GRID -> folderContentViewMode == FolderContentViewMode.COMFORT_GRID
                                  LibraryViewMode.COMPACT_GRID -> folderContentViewMode == FolderContentViewMode.COMPACT_GRID
