                      TrackRowItem(
                          title = "${track.label} (${track.language})",
                          badge = track.codecBadge,
                          selected = track.isSelected && !audioDisabled,
                          onClick = { onSelectAudioTrack(track) }
                      )
                  }
              }
          }

