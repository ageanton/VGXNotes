          // ============================================================================
          // 2. STRICT NEO-BRUTALIST THEME TOKEN SYSTEM (SECTION 3 EXACT HEX TOKENS)
          // ============================================================================

          @Immutable
          data class VdxThemeTokens(
              val palette: VdxThemePalette,
              val isDark: Boolean,
              val paper: Color,
              val card: Color,
              val ink: Color,
              val muted: Color,
              val onColor: Color,
              val tickerBg: Color,
              val onTicker: Color,
              val primary: Color,
              val secondary: Color,
              val tertiary: Color,
              val quaternary: Color,
              val danger: Color = Color(0xFFFF5C5C),
              val scrim: Color = Color(0x80000000),
              val tickerSlash: Color = Color(0xFF8A8A85),
              val thumbnailBadgeBg: Color = Color(0xFF111111),
              val thumbnailBadgeText: Color = Color(0xFFFFFFFF),
              val subtitlePresetColors: List<Int> = listOf(
                  0xFFFFFFFF.toInt(),
                  0xFFFFE45C.toInt(),
                  0xFF5CE1E6.toInt(),
                  0xFF5EE6A8.toInt(),
                  0xFFFF9CCB.toInt()
              )
          ) {
              fun folderTileFillForName(folderName: String): Color {
                  val mod = abs(folderName.hashCode()) % 4
                  return when (mod) {
                      0 -> primary
                      1 -> secondary
                      2 -> tertiary
                      else -> quaternary
                  }
              }

              val snackbarFill: Color
                  get() = if (isDark) card else ink

              val snackbarText: Color
                  get() = if (isDark) ink else thumbnailBadgeText
          }

