name: Build VDX Player APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vdx-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b682569dd4e08acf67170a2b42d829\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a578e44e3bb4530a66d34b880fb" > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Fonts
        run: |
          set -e
          mkdir -p app/src/main/res/font
          sudo apt-get update -y && sudo apt-get install -y fonts-dejavu-core fonts-liberation2 curl file

          get_font() {
            curl -sL --retry 3 --connect-timeout 10 "$1" -o "$2" || true
            if [ ! -s "$2" ] || ! file "$2" | grep -qiE "font|TrueType|OpenType"; then
              cp "$3" "$2"
            fi
          }

          F=app/src/main/res/font
          G=https://github.com/google/fonts/raw/main/ofl
          D=/usr/share/fonts/truetype/dejavu

          get_font "$G/inter/Inter%5Bopsz,wght%5D.ttf" $F/inter_regular.ttf $D/DejaVuSans.ttf
          get_font "$G/inter/Inter%5Bopsz,wght%5D.ttf" $F/inter_medium.ttf $D/DejaVuSans.ttf
          get_font "$G/inter/Inter%5Bopsz,wght%5D.ttf" $F/inter_bold.ttf $D/DejaVuSans-Bold.ttf
          get_font "$G/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf" $F/space_grotesk_medium.ttf $D/DejaVuSans.ttf
          get_font "$G/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf" $F/space_grotesk_bold.ttf $D/DejaVuSans-Bold.ttf
          get_font "$G/spacemono/SpaceMono-Regular.ttf" $F/space_mono_regular.ttf $D/DejaVuSansMono.ttf
          get_font "$G/spacemono/SpaceMono-Bold.ttf" $F/space_mono_bold.ttf $D/DejaVuSansMono-Bold.ttf
          get_font "$G/plusjakartasans/PlusJakartaSans%5Bwght%5D.ttf" $F/plus_jakarta_sans.ttf $D/DejaVuSans.ttf
          get_font "$G/opensans/OpenSans%5Bwdth,wght%5D.ttf" $F/open_sans.ttf $D/DejaVuSans.ttf
          get_font "$G/dmsans/DMSans%5Bopsz,wght%5D.ttf" $F/dm_sans.ttf $D/DejaVuSans.ttf

      - name: Initialize Gradle Wrapper & Compile VDX Player Debug APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload VDX Player APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VDX-Player-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
