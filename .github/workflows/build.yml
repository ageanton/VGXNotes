          @Composable
          private fun TrackRowItem(
              title: String,
              badge: String,
              selected: Boolean,
              onClick: () -> Unit
          ) {
              val tokens = VdxTheme.tokens
              NeoBrutalistBox(
                  modifier = Modifier.fillMaxWidth().height(48.dp),
                  fillColor = if (selected) tokens.primary else tokens.paper,
                  cornerRadius = 10.dp,
                  shadowOffset = 2.dp,
                  isSelectedOrPressedPermanently = selected,
                  onClick = onClick
              ) {
                  Row(
                      modifier = Modifier.fillMaxSize().padding(horizontal = 12.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.SpaceBetween
                  ) {
                      Text(
                          text = title,
                          style = SpaceGroteskItem15,
                          color = if (selected) tokens.onColor else tokens.ink,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis,
                          modifier = Modifier.weight(1f)
                      )
                      Spacer(Modifier.width(8.dp))
                      Text(
                          text = badge,
                          style = SpaceMonoBold11,
                          color = if (selected) tokens.onColor else tokens.muted
                      )
                  }
              }
          }

          private fun queryDisplayName(context: Context, uri: Uri): String? {
              return runCatching {
                  context.contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                      val idx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (idx >= 0 && cursor.moveToFirst()) cursor.getString(idx) else null
                  }
              }.getOrNull()
          }
