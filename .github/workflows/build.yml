          @Composable
          private fun SubtitleSideSheetContent(
              prefs: AppPreferencesState,
              subtitleTracks: List<PlayerTrackOption>,
              subtitlesEnabled: Boolean,
              externalSubtitleLabel: String?,
              subtitleDelayMs: Long,
              subtitleSpeedFactor: Float,
              subtitleAnchorTimeMs: Long,
              onSelectSubtitleTrack: (PlayerTrackOption?) -> Unit,
              onPickExternalSubtitle: () -> Unit,
              onAdjustSubtitleDelay: (Long) -> Unit,
              onResetSubtitleDelay: () -> Unit,
              onSetSubtitleSpeed: (Float) -> Unit,
              onAnchorSubtitleSpeedHere: () -> Unit,
              onUpdateSubtitleStyle: (SubtitleFontChoice?, Float?, Int?, Float?, Float?, Boolean?, Float?) -> Unit
          ) {
              val tokens = VdxTheme.tokens
              var subSection by remember { mutableIntStateOf(0) }

              Column(modifier = Modifier.fillMaxSize()) {
                  Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                      listOf("Tracks", "Sync", "Font").forEachIndexed { idx, label ->
                          val sel = subSection == idx
                          NeoBrutalistBox(
                              modifier = Modifier.weight(1f).height(40.dp),
                              fillColor = if (sel) tokens.primary else tokens.paper,
                              cornerRadius = 10.dp,
                              shadowOffset = 2.dp,
                              isSelectedOrPressedPermanently = sel,
                              onClick = { subSection = idx }
                          ) {
                              Text(label, style = SpaceMonoBold12, color = if (sel) tokens.onColor else tokens.ink)
                          }
                      }
                  }

                  Spacer(Modifier.height(10.dp))

                  Column(
                      modifier = Modifier.fillMaxSize().verticalScroll(rememberScrollState()),
                      verticalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      when (subSection) {
                          0 -> {
                              NeoBrutalistBox(
                                  modifier = Modifier.fillMaxWidth().height(46.dp),
                                  fillColor = tokens.secondary,
                                  cornerRadius = 10.dp,
                                  shadowOffset = 3.dp,
                                  onClick = onPickExternalSubtitle
                              ) {
                                  Text("Load subtitle file", style = SpaceGroteskItem15, color = tokens.onColor)
                              }

                              if (externalSubtitleLabel != null) {
                                  Text("Active: $externalSubtitleLabel", style = SpaceMonoRegular12, color = tokens.ink)
                              }

                              TrackRowItem(
                                  title = "Disable subtitles",
                                  badge = "Off",
                                  selected = !subtitlesEnabled,
                                  onClick = { onSelectSubtitleTrack(null) }
                              )

                              subtitleTracks.forEach { track ->
                                  TrackRowItem(
                                      title = "${track.label} (${track.language})",
                                      badge = track.codecBadge,
                                      selected = subtitlesEnabled && externalSubtitleLabel == null && track.isSelected,
                                      onClick = { onSelectSubtitleTrack(track) }
                                  )
                              }
                          }
                          1 -> {
                              Text("Offset: ${FormatUtils.formatSignedSeconds(subtitleDelayMs)}", style = SpaceMonoBold14, color = tokens.ink)
                              Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                  MicroTunerChip("-0.5s", tokens.paper) { onAdjustSubtitleDelay(-500L) }
                                  MicroTunerChip("-0.05s", tokens.paper) { onAdjustSubtitleDelay(-50L) }
                                  MicroTunerChip("+0.05s", tokens.paper) { onAdjustSubtitleDelay(50L) }
                                  MicroTunerChip("+0.5s", tokens.paper) { onAdjustSubtitleDelay(500L) }
                                  MicroTunerChip("Reset", tokens.tertiary, true, onResetSubtitleDelay)
                              }

                              Text(String.format(Locale.US, "Speed scaler: %.4fx", subtitleSpeedFactor), style = SpaceMonoBold14, color = tokens.ink)
                              Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                  MicroTunerChip("-0.1%", tokens.paper) { onSetSubtitleSpeed(subtitleSpeedFactor - 0.001f) }
                                  MicroTunerChip("+0.1%", tokens.paper) { onSetSubtitleSpeed(subtitleSpeedFactor + 0.001f) }
                                  MicroTunerChip("Anchor (${FormatUtils.formatDurationMs(subtitleAnchorTimeMs)})", tokens.secondary, true, onAnchorSubtitleSpeedHere)
                              }

                              val fpsPresets = listOf(
                                  "23.976 to 25 fps" to 0.9590f,
                                  "25 to 23.976 fps" to 1.0427f,
                                  "1.0000x normal" to 1.0000f
                              )
                              fpsPresets.forEach { (label, factor) ->
                                  TrackRowItem(
                                      title = label,
                                      badge = String.format(Locale.US, "%.4fx", factor),
                                      selected = abs(subtitleSpeedFactor - factor) < 0.0004f,
                                      onClick = { onSetSubtitleSpeed(factor) }
                                  )
                              }
                          }
                          2 -> {
                              Text("Professional font", style = SpaceMonoRegular12, color = tokens.muted)
                              SubtitleFontChoice.entries.forEach { fontChoice ->
                                  TrackRowItem(
                                      title = fontChoice.label,
                                      badge = "Font",
                                      selected = prefs.subtitleFont == fontChoice,
                                      onClick = { onUpdateSubtitleStyle(fontChoice, null, null, null, null, null, null) }
                                  )
                              }

                              Text("Size: ${prefs.subtitleFontSizeSp.roundToInt()}sp", style = SpaceMonoRegular13, color = tokens.ink)
                              NeoSlider(
                                  value = prefs.subtitleFontSizeSp,
                                  onValueChange = { onUpdateSubtitleStyle(null, it, null, null, null, null, null) },
                                  valueRange = 14f..42f
                              )

                              Text("Outline: ${String.format(Locale.US, "%.1fdp", prefs.subtitleOutlineWidthDp)}", style = SpaceMonoRegular13, color = tokens.ink)
                              NeoSlider(
                                  value = prefs.subtitleOutlineWidthDp,
                                  onValueChange = { onUpdateSubtitleStyle(null, null, null, it, null, null, null) },
                                  valueRange = 0f..5f
                              )

                              Text("Background opacity: ${(prefs.subtitleBgOpacity * 100).roundToInt()}%", style = SpaceMonoRegular13, color = tokens.ink)
                              NeoSlider(
                                  value = prefs.subtitleBgOpacity,
                                  onValueChange = { onUpdateSubtitleStyle(null, null, null, null, it, null, null) },
                                  valueRange = 0f..1f
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          private fun AudioSideSheetContent(
              audioDisabled: Boolean,
              audioTracks: List<PlayerTrackOption>,
              audioDelayMs: Long,
              volumeFraction: Float,
              onSetAudioDisabled: (Boolean) -> Unit,
              onSelectAudioTrack: (PlayerTrackOption) -> Unit,
