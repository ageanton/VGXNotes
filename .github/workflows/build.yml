name: Build VDX Player APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vdx-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b682569dd4e08acf67170a2b42d829\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a578e44e3bb4530a66d34b880fb" > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Project Structure, Fonts, Gradle Configs & Source Code
        run: |
          set -e
          mkdir -p app/src/main/java/com/flagship/videoplayer/data
          mkdir -p app/src/main/java/com/flagship/videoplayer/ui/theme
          mkdir -p app/src/main/java/com/flagship/videoplayer/ui/home
          mkdir -p app/src/main/java/com/flagship/videoplayer/ui/player
          mkdir -p app/src/main/java/com/flagship/videoplayer/engine
          mkdir -p app/src/main/res/font
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          sudo apt-get update -y && sudo apt-get install -y fonts-dejavu-core fonts-liberation2 curl file

          download_or_fallback_font() {
            local url="$1"
            local dest="$2"
            local fallback="$3"
            curl -sL --retry 3 --connect-timeout 10 "$url" -o "$dest" || true
            if [ ! -s "$dest" ] || ! file "$dest" | grep -qiE "font|TrueType|OpenType"; then
              cp "$fallback" "$dest"
            fi
          }

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" \
            "app/src/main/res/font/inter_regular.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" \
            "app/src/main/res/font/inter_medium.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" \
            "app/src/main/res/font/inter_bold.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf" \
            "app/src/main/res/font/space_grotesk_medium.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf" \
            "app/src/main/res/font/space_grotesk_bold.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/spacemono/SpaceMono-Regular.ttf" \
            "app/src/main/res/font/space_mono_regular.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/spacemono/SpaceMono-Bold.ttf" \
            "app/src/main/res/font/space_mono_bold.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/plusjakartasans/PlusJakartaSans%5Bwght%5D.ttf" \
            "app/src/main/res/font/plus_jakarta_sans.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/opensans/OpenSans%5Bwdth,wght%5D.ttf" \
            "app/src/main/res/font/open_sans.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          download_or_fallback_font \
            "https://github.com/google/fonts/raw/main/ofl/dmsans/DMSans%5Bopsz,wght%5D.ttf" \
            "app/src/main/res/font/dm_sans.ttf" \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VDXPlayer"
          include(":app")
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("com.google.devtools.ksp") version "2.0.21-1.0.27" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "com.flagship.videoplayer"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.flagship.videoplayer"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 300
                  versionName = "3.0.0-VDX"

                  vectorDrawables {
                      useSupportLibrary = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
                  debug {
                      applicationIdSuffix = ".debug"
                      versionNameSuffix = "-VDX"
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += listOf(
                      "-opt-in=androidx.media3.common.util.UnstableApi",
                      "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                      "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi",
                      "-opt-in=androidx.compose.animation.ExperimentalAnimationApi"
                  )
              }

              buildFeatures {
                  compose = true
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")

              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.documentfile:documentfile:1.0.1")

              val media3Version = "1.5.0"
              implementation("androidx.media3:media3-exoplayer:$media3Version")
              implementation("androidx.media3:media3-exoplayer-hls:$media3Version")
              implementation("androidx.media3:media3-exoplayer-dash:$media3Version")
              implementation("androidx.media3:media3-exoplayer-smoothstreaming:$media3Version")
              implementation("androidx.media3:media3-exoplayer-rtsp:$media3Version")
              implementation("androidx.media3:media3-datasource-okhttp:$media3Version")
              implementation("androidx.media3:media3-ui:$media3Version")
              implementation("androidx.media3:media3-session:$media3Version")
              implementation("androidx.media3:media3-common:$media3Version")
              implementation("org.jellyfin.media3:media3-ffmpeg-decoder:1.5.0+1")

              implementation("com.squareup.okhttp3:okhttp:4.12.0")

              val roomVersion = "2.6.1"
              implementation("androidx.room:room-runtime:$roomVersion")
              implementation("androidx.room:room-ktx:$roomVersion")
              ksp("androidx.room:room-compiler:$roomVersion")

              implementation("androidx.datastore:datastore-preferences:1.1.1")
              implementation("androidx.palette:palette-ktx:1.0.0")
              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("io.coil-kt:coil-video:2.7.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.FlagshipVideoPlayer" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_vdx_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#111111"
                  android:pathData="M54,4 A50,50 0 1,1 53.9,4 Z"/>
              <path
                  android:fillColor="#4D9CFF"
                  android:pathData="M54,10 A44,44 0 1,1 53.9,10 Z"/>
              <path
                  android:fillColor="#111111"
                  android:pathData="M43,34 L77,54 L43,74 Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M40,31 L74,51 L40,71 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path name="external_files" path="." />
              <files-path name="internal_files" path="." />
          </paths>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_vdx_round"
                  android:roundIcon="@drawable/ic_vdx_round"
                  android:label="VDX Player"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:largeHeap="true"
                  android:theme="@style/Theme.FlagshipVideoPlayer">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:supportsPictureInPicture="true"
                      android:launchMode="singleTask"
                      android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="content" />
                          <data android:scheme="file" />
                          <data android:mimeType="video/*" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" />
                          <data android:scheme="https" />
                          <data android:scheme="rtsp" />
                          <data android:mimeType="video/*" />
                          <data android:mimeType="application/vnd.apple.mpegurl" />
                          <data android:mimeType="application/x-mpegurl" />
                          <data android:mimeType="application/dash+xml" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/flagship/videoplayer/data/DatabaseAndModels.kt
          package com.flagship.videoplayer.data

          import android.content.ContentValues
          import android.content.Context
          import android.net.Uri
          import android.provider.MediaStore
          import androidx.datastore.core.DataStore
          import androidx.datastore.preferences.core.*
          import androidx.datastore.preferences.preferencesDataStore
          import androidx.room.*
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.catch
          import kotlinx.coroutines.flow.map
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.security.MessageDigest

          enum class AppThemeMode(val label: String) {
              OCEAN("Ocean"),
              BUBBLEGUM("Bubblegum"),
              BANANA("Banana"),
              LAVENDER("Lavender"),
              TERRACOTTA("Terracotta"),
              SLATE_DUSK("Slate dusk"),
              MIDNIGHT("Midnight")
          }

          enum class LibraryViewMode(val label: String) {
              FOLDER("Folders"),
              RICH_LIST("List"),
              COMFORT_GRID("Grid"),
              COMPACT_GRID("Compact grid")
          }

          enum class FolderContentViewMode(val label: String) {
              RICH_LIST("List"),
              COMFORT_GRID("Grid"),
              COMPACT_GRID("Compact grid")
          }

          enum class LibrarySortField(val label: String) {
              NAME("Title"),
              DATE_MODIFIED("Date added"),
              SIZE("File size"),
              DURATION("Duration"),
              LAST_PLAYED("Last played")
          }

          enum class DecoderMode(val badge: String, val description: String) {
              HW("HW", "Hardware MediaCodec"),
              HW_PLUS("HW+", "Hybrid Hardware + FFmpeg"),
              SW("SW", "FFmpeg Software Decoder")
          }

          enum class AspectRatioMode(val label: String) {
              FIT("Fit screen"),
              FILL("Fill / Crop"),
              STRETCH("Stretch"),
              RATIO_16_9("16:9"),
              RATIO_4_3("4:3")
          }

          enum class PlayerOrientationMode(val label: String) {
              SENSOR_LANDSCAPE("Landscape"),
              PORTRAIT("Portrait"),
              REVERSE_LANDSCAPE("Reverse landscape"),
              MATCH_VIDEO("Match video"),
              AUTO_SYSTEM("Auto rotate")
          }

          enum class SubtitleFontChoice(val label: String) {
              INTER("Inter (Default)"),
              ROBOTO("Roboto"),
              PLUS_JAKARTA("Plus Jakarta Sans"),
              OPEN_SANS("Open Sans"),
              DM_SANS("DM Sans")
          }

          enum class TopLeftQuickSlot(val key: String, val label: String) {
              SPEED("SPEED", "Playback speed"),
              BOOKMARK("BOOKMARK", "Bookmark pin"),
              LOOP("LOOP", "A-B loop"),
              ORIENTATION("ORIENTATION", "Portrait / Landscape"),
              SUBTITLES("SUBTITLES", "Subtitles"),
              AUDIO("AUDIO", "Audio tracks"),
              ASPECT("ASPECT", "Aspect ratio")
          }

          enum class TopRightQuickSlot(val key: String, val label: String) {
              LOCK("LOCK", "Lock controls"),
              DECODER("DECODER", "Decoder selector"),
              PIP("PIP", "Picture-in-Picture"),
              STATS("STATS", "Codec & renderer stats")
          }

          data class LocalVideoItem(
              val mediaStoreId: Long,
              val contentUri: Uri,
              val filePath: String,
              val folderPath: String,
              val folderName: String,
              val displayName: String,
              val titleWithoutExt: String,
              val extensionBadge: String,
              val sizeBytes: Long,
              val durationMs: Long,
              val width: Int,
              val height: Int,
              val resolutionBadge: String,
              val dateModifiedSec: Long,
              val sidecarSubtitlePaths: List<String>,
              val fileFingerprint: String,
              val savedPositionMs: Long = 0L,
              val lastPlayedAtMs: Long = 0L,
              val isNetworkStream: Boolean = false,
              val customHeaders: Map<String, String> = emptyMap(),
              val userAgent: String = "",
              val referer: String = ""
          ) {
              val completionFraction: Float
                  get() = if (durationMs > 0L) (savedPositionMs.toFloat() / durationMs.toFloat()).coerceIn(0f, 1f) else 0f

              val hasSidecarSubtitles: Boolean
                  get() = sidecarSubtitlePaths.isNotEmpty()
          }

          data class VideoFolderItem(
              val folderPath: String,
              val folderName: String,
              val videos: List<LocalVideoItem>,
              val totalSizeBytes: Long,
              val unplayedCount: Int,
              val lastPlayedVideo: LocalVideoItem?
          )

          @Entity(tableName = "cached_library_videos")
          data class CachedVideoEntity(
              @PrimaryKey val filePath: String,
              val mediaStoreId: Long,
              val contentUriString: String,
              val folderPath: String,
              val folderName: String,
              val displayName: String,
              val titleWithoutExt: String,
              val extensionBadge: String,
              val sizeBytes: Long,
              val durationMs: Long,
              val width: Int,
              val height: Int,
              val resolutionBadge: String,
              val dateModifiedSec: Long,
              val sidecarPathsJoined: String,
              val fileFingerprint: String
          ) {
              fun toLocalVideoItem(savedState: VideoStateEntity?): LocalVideoItem {
                  val sidecars = if (sidecarPathsJoined.isBlank()) emptyList() else sidecarPathsJoined.split("|")
                  return LocalVideoItem(
                      mediaStoreId = mediaStoreId,
                      contentUri = Uri.parse(contentUriString),
                      filePath = filePath,
                      folderPath = folderPath,
                      folderName = folderName,
                      displayName = displayName,
                      titleWithoutExt = titleWithoutExt,
                      extensionBadge = extensionBadge,
                      sizeBytes = sizeBytes,
                      durationMs = if (durationMs > 0L) durationMs else (savedState?.durationMs ?: 0L),
                      width = width,
                      height = height,
                      resolutionBadge = resolutionBadge,
                      dateModifiedSec = dateModifiedSec,
                      sidecarSubtitlePaths = sidecars,
                      fileFingerprint = fileFingerprint,
                      savedPositionMs = savedState?.positionMs ?: 0L,
                      lastPlayedAtMs = savedState?.lastPlayedAtMs ?: 0L
                  )
              }
          }

          @Entity(tableName = "video_states")
          data class VideoStateEntity(
              @PrimaryKey val fileFingerprint: String,
              val filePath: String,
              val folderPath: String,
              val displayName: String,
              val positionMs: Long = 0L,
              val durationMs: Long = 0L,
              val lastPlayedAtMs: Long = 0L,
              val playbackSpeed: Float = 1.0f,
              val decoderMode: String = DecoderMode.HW_PLUS.name,
              val zoomScale: Float = 1.0f,
              val panOffsetX: Float = 0f,
              val panOffsetY: Float = 0f,
              val aspectRatioMode: String = AspectRatioMode.FIT.name,
              val orientationMode: String = PlayerOrientationMode.SENSOR_LANDSCAPE.name,
              val audioTrackIndex: Int = -1,
              val isAudioDisabled: Boolean = false,
              val externalAudioUri: String? = null,
              val audioDelayMs: Long = 0L,
              val subtitleTrackIndex: Int = -1,
              val subtitlesEnabled: Boolean = true,
              val externalSubtitleUri: String? = null,
              val subtitleDelayMs: Long = 0L,
              val subtitleSpeedFactor: Float = 1.0f,
              val subtitleAnchorTimeMs: Long = 0L
          )

          @Entity(
              tableName = "video_bookmarks",
              indices = [Index(value = ["videoFingerprint"])]
          )
          data class BookmarkEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0L,
              val videoFingerprint: String,
              val timestampMs: Long,
              val label: String,
              val createdAtMs: Long = System.currentTimeMillis()
          )

          @Entity(
              tableName = "saved_ab_loops",
              indices = [Index(value = ["videoFingerprint"])]
          )
          data class SavedLoopEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0L,
              val videoFingerprint: String,
              val label: String,
              val startMs: Long,
              val endMs: Long,
              val createdAtMs: Long = System.currentTimeMillis()
          )

          @Entity(tableName = "trashed_videos")
          data class TrashedVideoEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0L,
              val fileFingerprint: String,
              val originalPath: String,
              val trashPath: String,
              val displayName: String,
              val sizeBytes: Long,
              val durationMs: Long,
              val trashedAtMs: Long,
              val expiresAtMs: Long
          ) {
              fun daysRemaining(nowMs: Long = System.currentTimeMillis()): Int {
                  val diff = (expiresAtMs - nowMs).coerceAtLeast(0L)
                  return ((diff / (24L * 3600_000L)) + 1L).toInt().coerceAtMost(30)
              }
          }

          @Entity(tableName = "network_stream_history")
          data class NetworkStreamHistoryEntity(
              @PrimaryKey val streamUrl: String,
              val title: String,
              val protocolBadge: String,
              val userAgent: String = "",
              val referer: String = "",
              val headersSerialized: String = "",
              val lastPositionMs: Long = 0L,
              val durationMs: Long = 0L,
              val lastPlayedAtMs: Long = System.currentTimeMillis()
          ) {
              fun parsedHeaders(): Map<String, String> {
                  if (headersSerialized.isBlank()) return emptyMap()
                  return headersSerialized.lines()
                      .mapNotNull { line ->
                          val idx = line.indexOf(':')
                          if (idx > 0) line.substring(0, idx).trim() to line.substring(idx + 1).trim()
                          else null
                      }.toMap()
              }

              companion object {
                  fun serializeHeaders(headers: Map<String, String>): String {
                      return headers.entries.joinToString("\n") { "${it.key}: ${it.value}" }
                  }

                  fun detectProtocolBadge(url: String): String {
                      val lower = url.lowercase()
                      return when {
                          lower.startsWith("rtsp://") -> "RTSP"
                          lower.contains(".m3u8") -> "HLS"
                          lower.contains(".mpd") -> "DASH"
                          lower.contains(".ism") -> "SMOOTH"
                          lower.contains(".mkv") -> "MKV"
                          lower.contains(".webm") -> "WEBM"
                          lower.startsWith("https://") -> "HTTPS"
                          else -> "HTTP"
                      }
                  }
              }
          }

          @Dao
          interface FlagshipPlayerDao {
              @Query("SELECT * FROM cached_library_videos")
              fun observeCachedVideos(): Flow<List<CachedVideoEntity>>

              @Query("SELECT * FROM cached_library_videos")
              suspend fun getCachedVideosOnce(): List<CachedVideoEntity>

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun upsertCachedVideos(videos: List<CachedVideoEntity>)

