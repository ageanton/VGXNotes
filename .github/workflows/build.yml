          @Composable
          private fun NeoThumbnailBox(
              video: LocalVideoItem,
              imageLoader: ImageLoader,
              modifier: Modifier = Modifier
          ) {
              val tokens = VdxTheme.tokens
              val shape = RoundedCornerShape(8.dp)
              Box(
                  modifier = modifier
                      .clip(shape)
                      .background(tokens.paper)
                      .border(2.dp, tokens.ink, shape)
              ) {
                  AsyncImage(
                      model = ImageRequest.Builder(LocalContext.current)
                          .data(video.contentUri)
                          .videoFrameMillis((video.durationMs / 4).coerceAtLeast(1000L))
                          .build(),
                      imageLoader = imageLoader,
                      contentDescription = video.displayName,
                      contentScale = ContentScale.Crop,
                      modifier = Modifier.fillMaxSize()
                  )

                  // Unwatched "New" square tag in tertiary with onColor text
                  if (video.lastPlayedAtMs == 0L) {
                      Box(
                          modifier = Modifier
                              .align(Alignment.TopStart)
                              .padding(6.dp)
                              .clip(RoundedCornerShape(4.dp))
                              .background(tokens.tertiary)
                              .border(1.5.dp, tokens.ink, RoundedCornerShape(4.dp))
                              .padding(horizontal = 5.dp, vertical = 1.dp)
                      ) {
                          Text(
                              text = "New",
                              style = SpaceMonoBold11,
                              color = tokens.onColor
                          )
                      }
                  }

                  // Duration badge at bottom-end, 6dp inset, fill #111111, text #FFFFFF in Space Mono 11sp, radius 4dp
                  Box(
                      modifier = Modifier
                          .align(Alignment.BottomEnd)
                          .padding(6.dp)
                          .clip(RoundedCornerShape(4.dp))
                          .background(tokens.thumbnailBadgeBg)
                          .padding(horizontal = 5.dp, vertical = 2.dp)
                  ) {
                      Text(
                          text = FormatUtils.formatDurationMs(video.durationMs),
                          style = SpaceMonoBold11,
                          color = tokens.thumbnailBadgeText
                      )
                  }

                  // Watch-progress bar: 4dp tall at bottom of thumbnail, track #111111, fill primary
                  if (video.savedPositionMs > 0L) {
                      Box(
                          modifier = Modifier
                              .align(Alignment.BottomCenter)
                              .fillMaxWidth()
                              .height(4.dp)
                              .background(tokens.thumbnailBadgeBg)
                      ) {
                          Box(
                              modifier = Modifier
                                  .fillMaxHeight()
                                  .fillMaxWidth(video.completionFraction)
                                  .background(tokens.primary)
                          )
                      }
                  }
              }
          }

