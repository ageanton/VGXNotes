                          // ------------------------------------------------------------
                          // BLOCK C: VIEW SWITCHER (4 equal-width buttons, 8dp apart, 50dp tall)
                          // Folders = primary, List = secondary, Grid = tertiary, Compact = quaternary
                          // ------------------------------------------------------------
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              val viewConfigs = listOf(
                                  Triple(LibraryViewMode.FOLDER, tokens.primary, LucideGlyph.FOLDER),
                                  Triple(LibraryViewMode.RICH_LIST, tokens.secondary, LucideGlyph.LIST),
                                  Triple(LibraryViewMode.COMFORT_GRID, tokens.tertiary, LucideGlyph.GRID_2X2),
                                  Triple(LibraryViewMode.COMPACT_GRID, tokens.quaternary, LucideGlyph.DOTS_3X3)
                              )

                              viewConfigs.forEach { (mode, ownColor, glyph) ->
                                  val isSelected = prefs.libraryViewMode == mode
                                  NeoBrutalistBox(
                                      modifier = Modifier
                                          .weight(1f)
                                          .height(54.dp),
                                      fillColor = if (isSelected) tokens.ink else ownColor,
                                      borderColor = tokens.ink,
                                      shadowColor = tokens.ink,
                                      cornerRadius = 10.dp,
                                      borderWidth = 2.dp,
                                      shadowOffset = 4.dp,
                                      isSelectedOrPressedPermanently = isSelected,
                                      contentDescriptionText = mode.label,
                                      onClick = {
                                          viewModel.setViewMode(mode)
                                          if (mode == LibraryViewMode.FOLDER) {
                                              viewModel.openFolder(null)
                                          }
                                      }
                                  ) {
                                      LucideIcon(
                                          icon = glyph,
                                          tint = if (isSelected) ownColor else tokens.onColor,
                                          size = 20.dp
                                      )
                                  }
                              }
                          }
                      }

                      // Active Folder Breadcrumb Bar when browsing inside a specific folder
                      if (selectedFolder != null) {
                          Spacer(Modifier.height(10.dp))
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 16.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              NeoBrutalistBox(
                                  modifier = Modifier.size(44.dp),
                                  fillColor = tokens.secondary,
                                  cornerRadius = 10.dp,
                                  shadowOffset = 3.dp,
                                  contentDescriptionText = "Back",
                                  onClick = { viewModel.openFolder(null) }
                              ) {
                                  LucideIcon(LucideGlyph.BACK, tint = tokens.onColor, size = 18.dp)
                              }
                              Spacer(Modifier.width(10.dp))
                              Text(
                                  text = File(selectedFolder!!).name.ifBlank { "Folder" },
                                  style = SpaceGroteskSectionTitle,
                                  color = tokens.ink,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                          }
                      }

                      Spacer(Modifier.height(12.dp))

                      // ================================================================
                      // LIBRARY BODY CONTENT (SECTION 7 LISTS, CARDS & GRIDS)
                      // ================================================================
                      Box(modifier = Modifier.weight(1f).fillMaxWidth()) {
                          if (!hasPermission) {
                              NeoEmptyOrPermissionState(
                                  heading = "Media permission needed",
                                  subtitle = "Allow video access to display your local library",
                                  buttonText = "Grant permission",
                                  onAction = { permissionLauncher.launch(requiredPermission) }
                              )
                          } else {
                              val displayedVideos = remember(videos, selectedFolder) {
                                  if (selectedFolder != null) {
                                      videos.filter { it.folderPath == selectedFolder }
                                  } else {
                                      videos
                                  }
                              }

                              if (prefs.libraryViewMode == LibraryViewMode.FOLDER && selectedFolder == null && searchQuery.isBlank()) {
                                  if (folders.isEmpty()) {
                                      NeoEmptyOrPermissionState(
                                          heading = "No videos found",
                                          subtitle = "Open a network stream or add videos to your device",
                                          buttonText = "Open network stream",
                                          onAction = { showNetworkSheet = true }
                                      )
                                  } else {
                                      NeoFolderListView(
                                          folders = folders,
                                          onFolderClick = { viewModel.openFolder(it.folderPath) }
                                      )
                                  }
                              } else {
                                  if (displayedVideos.isEmpty()) {
                                      NeoEmptyOrPermissionState(
                                          heading = "No matching videos",
                                          subtitle = "Try clearing your search filter or opening a stream",
                                          buttonText = "Open network stream",
                                          onAction = { showNetworkSheet = true }
                                      )
                                  } else {
                                      when (prefs.libraryViewMode) {
                                          LibraryViewMode.FOLDER, LibraryViewMode.RICH_LIST -> {
                                              NeoRichVideoListView(
                                                  videos = displayedVideos,
                                                  imageLoader = videoImageLoader,
                                                  onVideoClick = { onPlayVideo(it, true) },
                                                  onRenameClick = { videoToRename = it },
                                                  onTrashClick = { viewModel.moveVideoToTrash(it) }
                                              )
                                          }
                                          LibraryViewMode.COMFORT_GRID -> {
                                              NeoComfortGridView(
                                                  videos = displayedVideos,
                                                  imageLoader = videoImageLoader,
                                                  onVideoClick = { onPlayVideo(it, true) },
                                                  onRenameClick = { videoToRename = it },
                                                  onTrashClick = { viewModel.moveVideoToTrash(it) }
                                              )
                                          }
                                          LibraryViewMode.COMPACT_GRID -> {
                                              NeoCompactGridView(
                                                  videos = displayedVideos,
                                                  imageLoader = videoImageLoader,
                                                  onVideoClick = { onPlayVideo(it, true) },
                                                  onRenameClick = { videoToRename = it },
                                                  onTrashClick = { viewModel.moveVideoToTrash(it) }
                                              )
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }

                  // Context-Aware Smart Resume Button (Bottom-End, 10dp radius Neo-Brutalist Square)
                  resumeTarget?.let { targetVideo ->
                      Box(
                          modifier = Modifier
                              .align(Alignment.BottomEnd)
                              .padding(16.dp)
                      ) {
                          NeoBrutalistBox(
                              modifier = Modifier.size(60.dp),
                              fillColor = tokens.primary,
                              borderColor = tokens.ink,
                              shadowColor = tokens.ink,
                              cornerRadius = 10.dp,
                              borderWidth = 2.dp,
                              shadowOffset = 4.dp,
                              contentDescriptionText = "Play",
                              onClick = { onPlayVideo(targetVideo, true) }
                          ) {
                              Column(
                                  horizontalAlignment = Alignment.CenterHorizontally,
                                  verticalArrangement = Arrangement.Center
                              ) {
                                  LucideIcon(LucideGlyph.PLAY, tint = tokens.onColor, size = 22.dp)
                                  Spacer(Modifier.height(2.dp))
                                  Text(
                                      text = "${(targetVideo.completionFraction * 100).roundToInt()}%",
                                      style = SpaceMonoBold11,
                                      color = tokens.onColor
                                  )
                              }
                          }
                      }
                  }

                  // Neo-Brutalist Toast / Snackbar
                  activeToastMessage?.let { msg ->
                      Box(
                          modifier = Modifier
                              .align(Alignment.BottomCenter)
                              .padding(horizontal = 16.dp, vertical = 20.dp)
                      ) {
                          NeoBrutalistBox(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .height(52.dp),
                              fillColor = tokens.snackbarFill,
                              borderColor = tokens.ink,
                              shadowColor = tokens.ink,
                              cornerRadius = 10.dp,
                              borderWidth = 2.dp,
                              shadowOffset = 4.dp,
                              contentAlignment = Alignment.CenterStart
                          ) {
                              Text(
                                  text = msg,
                                  style = SpaceMonoRegular13,
                                  color = tokens.snackbarText,
                                  modifier = Modifier.padding(horizontal = 16.dp)
                              )
                          }
                      }
                  }
              }

              // Rename Dialog (Section 7 Dialog Spec: 3dp border, 6dp hard shadow, 14dp radius, scrim behind)
              videoToRename?.let { target ->
                  var newTitleText by remember(target) { mutableStateOf(target.titleWithoutExt) }
                  NeoDialog(
                      title = "Rename video",
                      onDismiss = { videoToRename = null },
                      confirmText = "Save",
                      onConfirm = {
                          viewModel.renameVideo(target, newTitleText)
                          videoToRename = null
                      }
                  ) {
                      Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          Text(
                              text = "Bookmarks, loops, and resume progress will be preserved.",
                              style = SpaceMonoRegular12,
                              color = tokens.muted
                          )
                          Box(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .height(48.dp)
                                  .clip(RoundedCornerShape(10.dp))
                                  .background(tokens.paper)
                                  .border(2.dp, tokens.ink, RoundedCornerShape(10.dp))
                                  .padding(horizontal = 12.dp),
                              contentAlignment = Alignment.CenterStart
                          ) {
                              BasicTextField(
                                  value = newTitleText,
                                  onValueChange = { newTitleText = it },
                                  singleLine = true,
                                  textStyle = SpaceMonoRegular14.copy(color = tokens.ink),
                                  cursorBrush = SolidColor(tokens.ink),
                                  modifier = Modifier.fillMaxWidth()
                              )
                          }
                      }
                  }
              }

              // Network Stream Bottom Sheet (Section 7 Bottom Sheet Spec: 3dp top border, 14dp top radius, 40x6dp ink handle)
              if (showNetworkSheet) {
                  NeoNetworkStreamBottomSheet(
                      streamHistory = networkStreams,
                      onLaunchStream = { url, title, ua, referer, headers ->
                          showNetworkSheet = false
                          viewModel.saveAndLaunchNetworkStream(url, title, ua, referer, headers) { streamItem ->
                              onPlayVideo(streamItem, true)
                          }
                      },
                      onDeleteHistory = { viewModel.deleteStreamHistoryItem(it) },
                      onDismiss = { showNetworkSheet = false }
                  )
              }
          }

