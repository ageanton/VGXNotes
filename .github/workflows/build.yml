                              ) {
                                  LucideIcon(
                                      icon = LucideGlyph.FOLDER,
                                      tint = tokens.onColor,
                                      size = 22.dp
                                  )
                              }

                              Spacer(Modifier.width(12.dp))

                              Column(modifier = Modifier.weight(1f)) {
                                  Text(
                                      text = folder.folderName,
                                      style = SpaceGroteskBody16,
                                      color = tokens.ink,
