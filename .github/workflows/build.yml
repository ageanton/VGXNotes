                                              text = "${item.daysRemaining()} days left • ${FormatUtils.formatFileSize(item.sizeBytes)}",
                                              style = SpaceMonoRegular12,
                                              color = tokens.muted
                                          )
                                      }
                                      NeoBrutalistBox(
                                          modifier = Modifier.size(42.dp),
