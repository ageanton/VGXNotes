                                  tint = Color.White,
                                  modifier = Modifier.size(22.dp)
                              )
                              Text(
                                  text = "+${skipIntervalSeconds}s",
                                  style = TabularMonoStyle,
                                  fontSize = 10.sp,
                                  fontWeight = FontWeight.Bold,
                                  color = Color.White
                              )
                          }
                      }
                  }

                  // --------------------------------------------------------------------
                  // BOTTOM PROGRESS DECK: NOTHING BELOW THE PROGRESS BAR!
                  // --------------------------------------------------------------------
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .align(Alignment.BottomCenter),
                      verticalArrangement = Arrangement.spacedBy(4.dp)
                  ) {
                      AnimatedVisibility(
                          visible = loopStartMs != null,
                          enter = fadeIn(),
                          exit = fadeOut()
                      ) {
                          LoopMicroTunerBar(
                              loopStartMs = loopStartMs ?: 0L,
                              loopEndMs = loopEndMs,
                              palette = palette,
                              onAdjustA = onAdjustLoopA,
                              onAdjustB = onAdjustLoopB,
                              onSaveLoop = onSaveLoop,
                              onClearLoop = onClearLoop
                          )
                      }

                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = 4.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text(
                              text = FormatUtils.formatDurationMs(currentPositionMs),
                              style = TabularMonoStyle,
                              fontSize = 13.sp,
                              fontWeight = FontWeight.Bold,
                              color = Color.White
                          )

                          val remainingMs = (durationMs - currentPositionMs).coerceAtLeast(0L)
                          Text(
                              text = "-${FormatUtils.formatDurationMs(remainingMs)} / ${FormatUtils.formatDurationMs(durationMs)}",
                              style = TabularMonoStyle,
                              fontSize = 12.sp,
                              color = Color.White.copy(alpha = 0.85f)
                          )
                      }

                      FlagshipTimelineCanvas(
                          currentPositionMs = currentPositionMs,
                          durationMs = durationMs,
                          bufferedPercentage = bufferedPercentage,
                          loopStartMs = loopStartMs,
                          loopEndMs = loopEndMs,
                          bookmarks = bookmarks,
                          palette = palette,
                          onScrub = onTimelineScrub,
                          onDragLoopBracket = onDragLoopBracket
                      )
                  }
              }
          }

