          @Composable
          private fun VideoSurfaceLayer(
              exoPlayer: ExoPlayer?,
              aspectRatioMode: AspectRatioMode,
              zoomScale: Float,
              panOffsetX: Float,
              panOffsetY: Float
          ) {
              val tokens = VdxTheme.tokens
              val aspectModifier = when (aspectRatioMode) {
                  AspectRatioMode.RATIO_16_9 -> Modifier.aspectRatio(16f / 9f)
                  AspectRatioMode.RATIO_4_3 -> Modifier.aspectRatio(4f / 3f)
                  else -> Modifier.fillMaxSize()
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(tokens.tickerBg),
                  contentAlignment = Alignment.Center
              ) {
                  if (exoPlayer != null) {
                      AndroidView(
                          factory = { ctx ->
                              PlayerView(ctx).apply {
                                  useController = false
                                  subtitleView?.visibility = android.view.View.GONE
                                  layoutParams = ViewGroup.LayoutParams(
                                      ViewGroup.LayoutParams.MATCH_PARENT,
                                      ViewGroup.LayoutParams.MATCH_PARENT
                                  )
                              }
                          },
                          update = { playerView ->
                              if (playerView.player != exoPlayer) {
                                  playerView.player = exoPlayer
                              }
                              playerView.resizeMode = when (aspectRatioMode) {
                                  AspectRatioMode.FIT, AspectRatioMode.RATIO_16_9, AspectRatioMode.RATIO_4_3 ->
                                      AspectRatioFrameLayout.RESIZE_MODE_FIT
                                  AspectRatioMode.FILL ->
                                      AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                                  AspectRatioMode.STRETCH ->
                                      AspectRatioFrameLayout.RESIZE_MODE_FILL
                              }
                          },
                          modifier = aspectModifier.graphicsLayer {
                              scaleX = zoomScale
                              scaleY = zoomScale
                              translationX = panOffsetX
                              translationY = panOffsetY
                          }
                      )
                  }
              }
          }

          @Composable
          private fun CustomSubtitleCanvasLayer(
              lines: List<String>,
              prefs: AppPreferencesState,
              bottomMargin: Dp,
              isInPipMode: Boolean,
              modifier: Modifier = Modifier
          ) {
              val tokens = VdxTheme.tokens
              val joinedText = remember(lines) { lines.joinToString("\n") }
              val fontFamily = remember(prefs.subtitleFont) { resolveSubtitleFontFamily(prefs.subtitleFont) }
              val effectiveFontSize = if (isInPipMode) 12.sp else prefs.subtitleFontSizeSp.sp
              val fontWeight = if (prefs.subtitleBold) FontWeight.Bold else FontWeight.Medium
              val textColor = Color(prefs.subtitleTextColorArgb)

              Box(
                  modifier = modifier
                      .fillMaxWidth()
                      .padding(horizontal = 24.dp)
                      .padding(bottom = bottomMargin),
                  contentAlignment = Alignment.BottomCenter
              ) {
                  Box(
                      modifier = Modifier
                          .clip(RoundedCornerShape(8.dp))
                          .background(tokens.thumbnailBadgeBg.copy(alpha = prefs.subtitleBgOpacity.coerceIn(0f, 0.92f)))
                          .padding(horizontal = 12.dp, vertical = 5.dp),
                      contentAlignment = Alignment.Center
                  ) {
                      if (prefs.subtitleOutlineWidthDp > 0.1f) {
                          val strokePx = with(LocalDensity.current) { prefs.subtitleOutlineWidthDp.dp.toPx() }
                          Text(
                              text = joinedText,
                              fontFamily = fontFamily,
                              fontSize = effectiveFontSize,
                              fontWeight = fontWeight,
                              textAlign = TextAlign.Center,
                              style = TextStyle.Default.copy(
                                  color = tokens.thumbnailBadgeBg,
                                  drawStyle = Stroke(
                                      width = strokePx * 2f,
                                      join = StrokeJoin.Round
                                  )
                              )
                          )
                      }
                      Text(
                          text = joinedText,
                          color = textColor,
                          fontFamily = fontFamily,
                          fontSize = effectiveFontSize,
                          fontWeight = fontWeight,
                          textAlign = TextAlign.Center
                      )
                  }
              }
          }

          @Composable
          private fun GestureInterceptorLayer(
              modifier: Modifier = Modifier,
              skipIntervalSeconds: Int,
              currentPositionMs: Long,
              durationMs: Long,
              currentBrightness: Float,
              currentVolume: Float,
              currentZoom: Float,
              currentPanX: Float,
              currentPanY: Float,
              defaultHoldSpeed: Float,
              onSingleTap: () -> Unit,
              onCenterDoubleTap: () -> Unit,
              onSideDoubleTapSeek: (Boolean, Int) -> Unit,
              onHorizontalSwipeSeek: (Long, Long) -> Unit,
              onBrightnessGesture: (Float) -> Unit,
              onVolumeGesture: (Float, Boolean) -> Unit,
              onHoldFastForwardStart: (Float) -> Unit,
              onHoldFastForwardSlide: (Float, Boolean) -> Unit,
              onHoldFastForwardEnd: () -> Unit,
              onPinchZoomAndPan: (Float, Float, Float) -> Unit,
              onGestureEnded: () -> Unit
          ) {
              val density = LocalDensity.current
              val edgeExclusionPx = with(density) { 28.dp.toPx() }

              val latestPos by rememberUpdatedState(currentPositionMs)
              val latestDur by rememberUpdatedState(durationMs.coerceAtLeast(1L))
              val latestBrightness by rememberUpdatedState(currentBrightness)
              val latestVolume by rememberUpdatedState(currentVolume)
              val latestZoom by rememberUpdatedState(currentZoom)
              val latestPanX by rememberUpdatedState(currentPanX)
              val latestPanY by rememberUpdatedState(currentPanY)
              val latestHoldSpeed by rememberUpdatedState(defaultHoldSpeed)
              val latestSkipSec by rememberUpdatedState(skipIntervalSeconds)

              Box(
                  modifier = modifier
                      .pointerInput(Unit) {
                          detectTapGestures(
                              onTap = { onSingleTap() },
                              onDoubleTap = { offset ->
                                  val width = size.width.toFloat().coerceAtLeast(1f)
                                  when {
                                      offset.x < width * 0.33f -> onSideDoubleTapSeek(false, latestSkipSec)
                                      offset.x > width * 0.67f -> onSideDoubleTapSeek(true, latestSkipSec)
                                      else -> onCenterDoubleTap()
                                  }
                              },
                              onLongPress = { startOffset ->
                                  if (startOffset.x < edgeExclusionPx || startOffset.x > size.width - edgeExclusionPx) {
                                      return@detectTapGestures
                                  }
                                  onHoldFastForwardStart(latestHoldSpeed)
                              }
                          )
                      }
                      .pointerInput(Unit) {
                          awaitEachGesture {
                              val down = awaitFirstDown(requireUnconsumed = false)
                              val width = size.width.toFloat().coerceAtLeast(1f)
                              val height = size.height.toFloat().coerceAtLeast(1f)

                              if (down.position.x < edgeExclusionPx ||
                                  down.position.x > width - edgeExclusionPx ||
                                  down.position.y < edgeExclusionPx ||
                                  down.position.y > height - edgeExclusionPx
                              ) {
                                  return@awaitEachGesture
                              }

                              // 0=undecided, 1=brightness, 2=volume, 3=pinch, 4=holdSlide, 5=horizontalSwipeSeek
                              var activeMode = 0
                              var accumBri = latestBrightness
                              var accumVol = latestVolume
                              val seekStartAnchorMs = latestPos
                              var lastSteppedHoldQuarter = (latestHoldSpeed * 4f).roundToInt()
                              val startTime = System.currentTimeMillis()
                              var totalDy = 0f
                              var totalDx = 0f

                              do {
                                  val event = awaitPointerEvent()
                                  val pressedCount = event.changes.count { it.pressed }

                                  if (pressedCount >= 2) {
                                      activeMode = 3
                                      val zoomChange = event.calculateZoom()
                                      val panChange = event.calculatePan()
                                      val nextScale = (latestZoom * zoomChange).coerceIn(0.25f, 5.0f)
                                      val nextPanX = if (nextScale > 1.01f) latestPanX + panChange.x else 0f
                                      val nextPanY = if (nextScale > 1.01f) latestPanY + panChange.y else 0f
                                      onPinchZoomAndPan(nextScale, nextPanX, nextPanY)
                                      event.changes.forEach { it.consume() }
                                  } else if (pressedCount == 1 && activeMode != 3) {
                                      val change = event.changes.first()
                                      val dx = change.positionChange().x
                                      val dy = change.positionChange().y
                                      totalDx += dx
                                      totalDy += dy

                                      val heldDuration = System.currentTimeMillis() - startTime
                                      if (heldDuration > 420L && abs(totalDy) < 28f && abs(totalDx) < 28f && activeMode == 0) {
                                          activeMode = 4
                                      }

                                      if (activeMode == 4) {
                                          val deltaSpeed = (change.position.x - down.position.x) / (width * 0.28f)
                                          val newSpeed = (latestHoldSpeed + deltaSpeed).coerceIn(1.25f, 4.0f)
                                          val quarter = (newSpeed * 4f).roundToInt()
                                          val ticked = quarter != lastSteppedHoldQuarter
                                          lastSteppedHoldQuarter = quarter
                                          onHoldFastForwardSlide(newSpeed, ticked)
                                          change.consume()
                                      } else if (activeMode == 0) {
                                          if (abs(totalDx) > 24f && abs(totalDx) > abs(totalDy) * 1.35f) {
                                              activeMode = 5
                                          } else if (abs(totalDy) > 22f && abs(totalDy) > abs(totalDx) * 1.3f) {
                                              if (down.position.x < width * 0.35f) {
                                                  activeMode = 1
                                                  accumBri = latestBrightness
                                              } else if (down.position.x > width * 0.65f) {
                                                  activeMode = 2
                                                  accumVol = latestVolume
                                              }
                                          }
                                      }

                                      when (activeMode) {
                                          1 -> {
                                              val deltaBri = -dy / (height * 0.68f)
                                              accumBri = (accumBri + deltaBri).coerceIn(-0.5f, 1.0f)
                                              onBrightnessGesture(accumBri)
                                              change.consume()
                                          }
                                          2 -> {
                                              val deltaVol = -dy / (height * 0.55f)
                                              val prevAbove = accumVol >= 1.0f
                                              accumVol = (accumVol + deltaVol).coerceIn(0.0f, 2.0f)
                                              val nowAbove = accumVol >= 1.0f
                                              onVolumeGesture(accumVol, !prevAbove && nowAbove)
                                              change.consume()
                                          }
                                          5 -> {
                                              // Tasteful Horizontal Swipe-to-Seek:
                                              // Full screen width = 90 seconds max (or 20% of short clips), smooth cubic response
                                              val maxSweepMs = minOf(90_000L, (latestDur * 0.35f).roundToLong().coerceAtLeast(15_000L))
                                              val normX = ((change.position.x - down.position.x) / (width * 0.75f)).coerceIn(-1f, 1f)
                                              val deltaMs = (normX * maxSweepMs).roundToLong()
                                              val targetMs = (seekStartAnchorMs + deltaMs).coerceIn(0L, latestDur)
                                              onHorizontalSwipeSeek(targetMs, targetMs - seekStartAnchorMs)
                                              change.consume()
                                          }
                                      }
                                  }
                              } while (event.changes.any { it.pressed })

                              onHoldFastForwardEnd()
                              onGestureEnded()
                          }
                      }
              )
          }

          // ============================================================================
          // 3. LAYER 4: LIGHTNING-FAST TRANSIENT GESTURE HUDS ("2x" BADGE, SWIPE SEEK)
          // ============================================================================

          @Composable
          private fun TransientGestureHudLayer(
              activeGestureHud: ActiveGestureHud,
              brightnessFraction: Float,
              volumeFraction: Float,
              isHoldFastForward: Boolean,
              activeHoldSpeed: Float,
              horizontalSeekTargetMs: Long,
              horizontalSeekDeltaMs: Long,
              doubleTapSide: Int,
              doubleTapAccumulatedSec: Int,
              zoomScale: Float,
              showNerdStats: Boolean,
              nerdStats: LiveNerdStats,
              toastBannerText: String?,
              onResetZoom: () -> Unit,
              onCloseNerdStats: () -> Unit
          ) {
              val tokens = VdxTheme.tokens

              Box(modifier = Modifier.fillMaxSize()) {
                  // 1. Brightness HUD (Right side)
                  if (activeGestureHud == ActiveGestureHud.BRIGHTNESS) {
                      val pct = (brightnessFraction * 100f).roundToInt()
                      val normalizedFill = ((brightnessFraction + 0.5f) / 1.5f).coerceIn(0f, 1f)
                      Box(
                          modifier = Modifier
                              .align(Alignment.CenterEnd)
                              .padding(end = 36.dp)
                      ) {
                          NeoVerticalMeterHud(
                              icon = LucideGlyph.SUN_BRIGHTNESS,
                              percentageText = "$pct%",
                              fillFraction = normalizedFill,
                              fillColor = if (brightnessFraction < 0f) tokens.tertiary else tokens.primary
                          )
                      }
                  }

                  // 2. Volume HUD (Left side)
                  if (activeGestureHud == ActiveGestureHud.VOLUME) {
                      val pct = (volumeFraction * 100f).roundToInt()
                      val normalizedFill = (volumeFraction / 2.0f).coerceIn(0f, 1f)
                      Box(
                          modifier = Modifier
                              .align(Alignment.CenterStart)
                              .padding(start = 36.dp)
                      ) {
                          NeoVerticalMeterHud(
                              icon = if (pct == 0) LucideGlyph.VOLUME_MUTE else LucideGlyph.AUDIO_WAVE,
                              percentageText = "$pct%",
                              fillFraction = normalizedFill,
                              fillColor = if (volumeFraction > 1.01f) tokens.tertiary else tokens.primary
                          )
                      }
                  }

                  // 3. Lightning-Quick Hold-to-Fast-Forward Badge: ONLY "2x" (or active multiplier), gone immediately on release!
                  if (isHoldFastForward || activeGestureHud == ActiveGestureHud.HOLD_FAST_FORWARD) {
                      val speedText = if (abs(activeHoldSpeed - activeHoldSpeed.roundToInt()) < 0.05f) {
                          "${activeHoldSpeed.roundToInt()}x"
                      } else {
                          String.format(Locale.US, "%.1fx", activeHoldSpeed)
                      }
                      Box(
                          modifier = Modifier
                              .align(Alignment.TopCenter)
                              .padding(top = 20.dp)
                      ) {
                          NeoBrutalistBox(
                              modifier = Modifier.height(42.dp),
                              fillColor = tokens.primary,
                              borderColor = tokens.ink,
                              shadowColor = tokens.ink,
                              cornerRadius = 10.dp,
                              borderWidth = 2.dp,
                              shadowOffset = 3.dp
                          ) {
                              Row(
                                  modifier = Modifier.padding(horizontal = 14.dp),
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.spacedBy(6.dp)
                              ) {
                                  Text(
                                      text = speedText,
                                      style = SpaceMonoBold14,
                                      color = tokens.onColor
                                  )
                                  LucideIcon(LucideGlyph.SKIP_FORWARD, tint = tokens.onColor, size = 16.dp)
                              }
                          }
                      }
                  }

                  // 4. Horizontal Finger-Swipe Seek Readout
                  if (activeGestureHud == ActiveGestureHud.HORIZONTAL_SEEK) {
                      val sign = if (horizontalSeekDeltaMs >= 0L) "+" else "-"
                      val deltaSec = abs(horizontalSeekDeltaMs) / 1000L
                      Box(
                          modifier = Modifier.align(Alignment.Center)
                      ) {
                          NeoBrutalistBox(
                              modifier = Modifier.height(58.dp),
                              fillColor = tokens.card,
                              borderColor = tokens.ink,
                              shadowColor = tokens.ink,
                              cornerRadius = 10.dp,
                              borderWidth = 2.dp,
                              shadowOffset = 4.dp
                          ) {
                              Column(
                                  modifier = Modifier.padding(horizontal = 18.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally,
                                  verticalArrangement = Arrangement.Center
                              ) {
                                  Text(
                                      text = FormatUtils.formatDurationMs(horizontalSeekTargetMs),
                                      style = SpaceGroteskSectionTitle,
                                      color = tokens.ink
                                  )
                                  Text(
                                      text = "${sign}${deltaSec}s",
                                      style = SpaceMonoBold12,
                                      color = tokens.primary
                                  )
                              }
                          }
                      }
                  }

                  // 5. Double-Tap Skip Indicator
                  if (doubleTapSide != 0 && doubleTapAccumulatedSec != 0) {
                      Box(
                          modifier = Modifier
                              .align(if (doubleTapSide < 0) Alignment.CenterStart else Alignment.CenterEnd)
                              .padding(horizontal = 48.dp)
                      ) {
                          NeoBrutalistBox(
                              modifier = Modifier.size(width = 76.dp, height = 50.dp),
                              fillColor = tokens.secondary,
                              cornerRadius = 10.dp,
                              shadowOffset = 4.dp
                          ) {
                              val sign = if (doubleTapAccumulatedSec > 0) "+" else ""
                              Text(
                                  text = "${sign}${doubleTapAccumulatedSec}s",
                                  style = SpaceMonoBold14,
                                  color = tokens.onColor
                              )
                          }
                      }
                  }

                  // 6. Pinch-to-Zoom Reset Button
                  if (abs(zoomScale - 1.0f) > 0.03f && !isHoldFastForward) {
                      Box(
                          modifier = Modifier
                              .align(Alignment.TopCenter)
                              .padding(top = 20.dp)
                      ) {
                          NeoBrutalistBox(
                              modifier = Modifier.height(40.dp),
                              fillColor = tokens.tertiary,
                              cornerRadius = 10.dp,
                              shadowOffset = 3.dp,
                              onClick = onResetZoom
                          ) {
                              Text(
                                  text = "${(zoomScale * 100).roundToInt()}% zoom • Reset",
                                  style = SpaceMonoBold12,
                                  color = tokens.onColor,
                                  modifier = Modifier.padding(horizontal = 12.dp)
                              )
                          }
                      }
                  }

                  // 7. Codec & Nerd Stats Card (Toggled from Top-Right Menu)
                  if (showNerdStats) {
                      Box(
                          modifier = Modifier
                              .align(Alignment.CenterStart)
                              .padding(start = 16.dp)
                      ) {
                          NeoBrutalistBox(
                              modifier = Modifier.width(290.dp),
                              fillColor = tokens.card,
                              cornerRadius = 14.dp,
                              shadowOffset = 4.dp
                          ) {
                              Column(
                                  modifier = Modifier.padding(12.dp),
                                  verticalArrangement = Arrangement.spacedBy(4.dp)
                              ) {
                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Text("Codec & stats", style = SpaceGroteskBody16, color = tokens.ink)
                                      Box(
                                          modifier = Modifier
                                              .size(28.dp)
                                              .clickable { onCloseNerdStats() },
                                          contentAlignment = Alignment.Center
                                      ) {
                                          LucideIcon(LucideGlyph.CLEAR_X, tint = tokens.ink, size = 16.dp)
                                      }
                                  }
                                  Text("Video: ${nerdStats.videoCodec} (${nerdStats.resolutionAndFps})", style = SpaceMonoRegular12, color = tokens.ink)
                                  Text("Decoder: ${nerdStats.activeDecoderBadge}", style = SpaceMonoRegular12, color = tokens.ink)
                                  Text("Audio: ${nerdStats.audioCodecAndChannels}", style = SpaceMonoRegular12, color = tokens.ink)
                                  Text("Dropped frames: ${nerdStats.droppedFrames}", style = SpaceMonoRegular12, color = tokens.muted)
                              }
                          }
                      }
                  }

                  // 8. Transient Toast Notification
                  toastBannerText?.let { banner ->
                      Box(
                          modifier = Modifier
                              .align(Alignment.BottomCenter)
                              .padding(bottom = 86.dp)
                      ) {
                          NeoBrutalistBox(
                              modifier = Modifier.height(42.dp),
                              fillColor = tokens.snackbarFill,
                              cornerRadius = 10.dp,
                              shadowOffset = 3.dp
                          ) {
                              Text(
                                  text = banner,
                                  style = SpaceMonoRegular13,
                                  color = tokens.snackbarText,
                                  modifier = Modifier.padding(horizontal = 14.dp)
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          private fun NeoVerticalMeterHud(
              icon: LucideGlyph,
              percentageText: String,
              fillFraction: Float,
              fillColor: Color
          ) {
              val tokens = VdxTheme.tokens
              NeoBrutalistBox(
                  modifier = Modifier.size(width = 56.dp, height = 188.dp),
                  fillColor = tokens.card,
                  cornerRadius = 10.dp,
                  shadowOffset = 4.dp
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(vertical = 10.dp, horizontal = 6.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.SpaceBetween
                  ) {
                      Text(text = percentageText, style = SpaceMonoBold11, color = tokens.ink)
                      Box(
                          modifier = Modifier
                              .width(14.dp)
                              .weight(1f)
                              .padding(vertical = 8.dp)
                              .clip(RoundedCornerShape(4.dp))
                              .background(tokens.paper)
                              .border(2.dp, tokens.ink, RoundedCornerShape(4.dp)),
                          contentAlignment = Alignment.BottomCenter
                      ) {
                          Box(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .fillMaxHeight(fillFraction.coerceIn(0f, 1f))
                                  .background(fillColor)
                          )
                      }
                      LucideIcon(icon = icon, tint = tokens.ink, size = 18.dp)
                  }
              }
          }
