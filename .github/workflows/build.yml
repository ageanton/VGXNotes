                  NeoBrutalistBox(
                      modifier = Modifier.fillMaxWidth().height(46.dp),
                      fillColor = tokens.secondary,
                      cornerRadius = 10.dp,
                      shadowOffset = 3.dp,
                      onClick = onPickExternalAudio
                  ) {
                      Text("Load external audio file", style = SpaceGroteskItem15, color = tokens.onColor)
