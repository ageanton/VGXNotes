                      android:enabled="false"
                      android:exported="true"
                      android:icon="@drawable/ic_vdx_emerald"
                      android:roundIcon="@drawable/ic_vdx_emerald"
                      android:label="VDX Player"
                      android:targetActivity=".MainActivity">
                      <intent-filter>
