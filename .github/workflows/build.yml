                                      if (TopRightQuickSlot.PIP !in enabledTopRightSlots) {
                                          DropdownMenuItem(
                                              text = { Text("Picture-in-Picture") },
                                              leadingIcon = { Icon(Icons.Default.PictureInPictureAlt, contentDescription = null) },
                                              onClick = {
                                                  showTopRightMainMenu = false
                                                  onEnterPip()
