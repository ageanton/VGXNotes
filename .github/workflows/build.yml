                  listOf(0.5f, 0.75f, 1.0f, 1.25f, 1.5f, 2.0f, 2.5f, 3.0f, 4.0f).forEach { spd ->
                      TrackRowItem(
                          title = String.format(Locale.US, "%.2fx speed", spd),
