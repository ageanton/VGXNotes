                                              contentDescription = "Audio",
                                              palette = palette,
                                              onClick = { onOpenSideSheet(SideSheetTab.AUDIO) }
                                          )
                                      }
                                      TopLeftQuickSlot.ASPECT -> {
                                          OsdRoundedIconButton(
                                              icon = Icons.Default.AspectRatio,
                                              contentDescription = "Aspect ratio",
                                              palette = palette,
                                              onClick = onCycleAspectRatio
                                          )
                                      }
                                  }
                              }
                          }
                      }
