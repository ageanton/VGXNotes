          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.SolidColor
          import androidx.compose.ui.graphics.StrokeCap
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.input.pointer.positionChange
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.window.Dialog
          import com.flagship.videoplayer.data.*
          import com.flagship.videoplayer.engine.PlayerTrackOption
          import com.flagship.videoplayer.ui.theme.*
          import java.util.Locale
          import kotlin.math.abs
          import kotlin.math.roundToInt
          import kotlin.math.roundToLong

          // ============================================================================
          // 1. LAYER 5: REORGANIZED NEO-BRUTALIST OSD CHROME
          // - Top-Left: Back + Title, and directly below it: Speed, Bookmark, Loop, Portrait/Landscape
          // - Top-Right: ONLY Lock, Decoder, Menu
          // - Center: ONLY Skip Back, Play/Pause, Skip Forward
          // - Bottom: Progress Bar at the very bottom with NOTHING below it!
          // ============================================================================

          @Composable
          fun MainOsdChromeLayer(
              videoTitle: String,
              isPlaying: Boolean,
              currentPositionMs: Long,
              durationMs: Long,
              bufferedPercentage: Int,
              decoderMode: DecoderMode,
              playbackSpeed: Float,
              skipIntervalSeconds: Int,
              aspectRatioMode: AspectRatioMode,
              orientationMode: PlayerOrientationMode,
              enabledTopLeftSlots: List<TopLeftQuickSlot>,
              loopStartMs: Long?,
              loopEndMs: Long?,
              bookmarks: List<BookmarkEntity>,
              onBack: () -> Unit,
              onOpenDecoderMenu: () -> Unit,
              onOpenTopRightMenu: () -> Unit,
              onLockTouch: () -> Unit,
              onPlayPause: () -> Unit,
              onSeekRelative: (Long) -> Unit,
              onTimelineScrub: (Long) -> Unit,
              onDragLoopBracket: (Long, Long) -> Unit,
              onTapLoopPill: () -> Unit,
              onAdjustLoopA: (Long) -> Unit,
              onAdjustLoopB: (Long) -> Unit,
              onSaveLoop: () -> Unit,
              onClearLoop: () -> Unit,
              onAddBookmark: () -> Unit,
              onTogglePortraitLandscape: () -> Unit,
              onCycleAspectRatio: () -> Unit,
              onOpenSideSheet: (SideSheetTab) -> Unit
          ) {
              val tokens = VdxTheme.tokens

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(horizontal = 16.dp, vertical = 12.dp)
              ) {
                  // --------------------------------------------------------------------
                  // TOP BAR:
                  // Left Column = Back + Title, and beneath the title: Speed, Bookmark, Loop, Portrait/Landscape
                  // Right Row = ONLY Lock, Decoder, Menu
                  // --------------------------------------------------------------------
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .align(Alignment.TopCenter),
                      verticalAlignment = Alignment.Top,
                      horizontalArrangement = Arrangement.SpaceBetween
                  ) {
                      // Top-Left Column (Title + Quick Slots Underneath Title)
                      Column(
                          modifier = Modifier
                              .weight(1f)
                              .padding(end = 12.dp),
                          verticalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              NeoBrutalistBox(
                                  modifier = Modifier.size(44.dp),
                                  fillColor = tokens.secondary,
                                  cornerRadius = 10.dp,
                                  shadowOffset = 3.dp,
                                  contentDescriptionText = "Back",
                                  onClick = onBack
                              ) {
                                  LucideIcon(LucideGlyph.BACK, tint = tokens.onColor, size = 20.dp)
                              }

                              Spacer(Modifier.width(10.dp))

                              NeoBrutalistBox(
                                  modifier = Modifier.height(44.dp),
                                  fillColor = tokens.card,
                                  cornerRadius = 10.dp,
                                  shadowOffset = 3.dp
                              ) {
                                  Text(
                                      text = videoTitle,
                                      style = SpaceGroteskBody16,
                                      color = tokens.ink,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis,
                                      modifier = Modifier.padding(horizontal = 12.dp)
                                  )
                              }
                          }

                          // Quick-Action Row Directly Beneath the Video Title
                          LazyRow(
                              horizontalArrangement = Arrangement.spacedBy(8.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              items(enabledTopLeftSlots, key = { it.id }) { slot ->
                                  when (slot) {
                                      TopLeftQuickSlot.SPEED -> {
                                          NeoTopLeftQuickButton(
                                              icon = LucideGlyph.SPEED_GAUGE,
                                              label = String.format(Locale.US, "%.2fx", playbackSpeed),
                                              fillColor = if (abs(playbackSpeed - 1.0f) > 0.01f) tokens.primary else tokens.card,
                                              isHighlighted = abs(playbackSpeed - 1.0f) > 0.01f,
                                              onClick = { onOpenSideSheet(SideSheetTab.SPEED) }
                                          )
                                      }
                                      TopLeftQuickSlot.BOOKMARK -> {
                                          NeoTopLeftQuickButton(
                                              icon = LucideGlyph.BOOKMARK,
                                              label = if (bookmarks.isEmpty()) "Bookmark" else "Bookmark (${bookmarks.size})",
                                              fillColor = tokens.secondary,
                                              isHighlighted = true,
                                              onClick = onAddBookmark
                                          )
                                      }
                                      TopLeftQuickSlot.LOOP -> {
                                          val loopLabel = when {
                                              loopStartMs == null -> "Loop"
                                              loopEndMs == null -> "Loop A set"
                                              else -> "Loop A-B"
                                          }
                                          NeoTopLeftQuickButton(
                                              icon = LucideGlyph.REPEAT_LOOP,
                                              label = loopLabel,
                                              fillColor = if (loopStartMs != null) tokens.tertiary else tokens.card,
                                              isHighlighted = loopStartMs != null,
                                              onClick = onTapLoopPill
                                          )
                                      }
                                      TopLeftQuickSlot.ORIENTATION -> {
                                          val orientLabel = if (orientationMode == PlayerOrientationMode.PORTRAIT) "Portrait" else "Landscape"
                                          NeoTopLeftQuickButton(
                                              icon = LucideGlyph.ROTATE_ORIENTATION,
                                              label = orientLabel,
                                              fillColor = tokens.quaternary,
                                              isHighlighted = true,
                                              onClick = onTogglePortraitLandscape
                                          )
                                      }
                                      TopLeftQuickSlot.ASPECT -> {
                                          NeoTopLeftQuickButton(
                                              icon = LucideGlyph.ASPECT_FRAME,
                                              label = aspectRatioMode.label,
                                              fillColor = tokens.card,
                                              isHighlighted = false,
                                              onClick = onCycleAspectRatio
                                          )
                                      }
                                      TopLeftQuickSlot.SUBTITLES -> {
                                          NeoTopLeftQuickButton(
                                              icon = LucideGlyph.SUBTITLES,
                                              label = "Subtitles",
                                              fillColor = tokens.card,
                                              isHighlighted = false,
                                              onClick = { onOpenSideSheet(SideSheetTab.SUBTITLES) }
                                          )
                                      }
                                      TopLeftQuickSlot.AUDIO -> {
                                          NeoTopLeftQuickButton(
                                              icon = LucideGlyph.AUDIO_WAVE,
                                              label = "Audio",
                                              fillColor = tokens.card,
                                              isHighlighted = false,
                                              onClick = { onOpenSideSheet(SideSheetTab.AUDIO) }
                                          )
                                      }
                                  }
                              }
                          }
                      }

                      // Top-Right Row: ONLY Lock, Decoder, and Menu
                      Row(
                          horizontalArrangement = Arrangement.spacedBy(8.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          // 1. Lock Button
                          NeoBrutalistBox(
                              modifier = Modifier.size(44.dp),
                              fillColor = tokens.card,
                              cornerRadius = 10.dp,
                              shadowOffset = 3.dp,
                              onClick = onLockTouch
                          ) {
                              LucideIcon(LucideGlyph.LOCK, tint = tokens.ink, size = 20.dp)
                          }

                          // 2. Decoder Button (Opens Decoder Picker Menu instead of cycling!)
                          NeoBrutalistBox(
                              modifier = Modifier.height(44.dp),
                              fillColor = tokens.tertiary,
                              cornerRadius = 10.dp,
                              shadowOffset = 3.dp,
                              onClick = onOpenDecoderMenu
                          ) {
                              Row(
                                  modifier = Modifier.padding(horizontal = 12.dp),
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.spacedBy(6.dp)
                              ) {
                                  LucideIcon(LucideGlyph.CPU_DECODER, tint = tokens.onColor, size = 18.dp)
                                  Text(
                                      text = decoderMode.badge,
                                      style = SpaceMonoBold12,
                                      color = tokens.onColor
                                  )
                              }
                          }

                          // 3. Menu Button
                          NeoBrutalistBox(
                              modifier = Modifier.size(44.dp),
                              fillColor = tokens.primary,
                              cornerRadius = 10.dp,
                              shadowOffset = 3.dp,
                              onClick = onOpenTopRightMenu
                          ) {
                              LucideIcon(LucideGlyph.MENU_MORE, tint = tokens.onColor, size = 20.dp)
                          }
                      }
                  }

                  // --------------------------------------------------------------------
                  // CENTER CONTROLS: ONLY Skip Backward, Play/Pause, and Skip Forward
                  // --------------------------------------------------------------------
                  Row(
                      modifier = Modifier.align(Alignment.Center),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(24.dp)
                  ) {
                      // Skip Backward (3s / 5s / 10s)
                      NeoBrutalistBox(
                          modifier = Modifier.size(width = 64.dp, height = 56.dp),
                          fillColor = tokens.secondary,
                          cornerRadius = 10.dp,
                          shadowOffset = 4.dp,
                          onClick = { onSeekRelative(-skipIntervalSeconds * 1000L) }
                      ) {
                          Column(
                              horizontalAlignment = Alignment.CenterHorizontally,
                              verticalArrangement = Arrangement.Center
                          ) {
                              LucideIcon(LucideGlyph.SKIP_BACK, tint = tokens.onColor, size = 20.dp)
                              Text(
                                  text = "-${skipIntervalSeconds}s",
                                  style = SpaceMonoBold11,
                                  color = tokens.onColor
                              )
                          }
                      }

                      // Main Play / Pause Button (Recolored by active theme's primary token)
                      NeoBrutalistBox(
                          modifier = Modifier.size(72.dp),
                          fillColor = tokens.primary,
                          cornerRadius = 14.dp,
                          shadowOffset = 5.dp,
                          contentDescriptionText = if (isPlaying) "Pause" else "Play",
                          onClick = onPlayPause
                      ) {
                          LucideIcon(
                              icon = if (isPlaying) LucideGlyph.PAUSE else LucideGlyph.PLAY,
                              tint = tokens.onColor,
                              size = 30.dp
                          )
                      }

                      // Skip Forward (3s / 5s / 10s)
                      NeoBrutalistBox(
                          modifier = Modifier.size(width = 64.dp, height = 56.dp),
                          fillColor = tokens.secondary,
                          cornerRadius = 10.dp,
                          shadowOffset = 4.dp,
                          onClick = { onSeekRelative(skipIntervalSeconds * 1000L) }
                      ) {
                          Column(
                              horizontalAlignment = Alignment.CenterHorizontally,
                              verticalArrangement = Arrangement.Center
                          ) {
                              LucideIcon(LucideGlyph.SKIP_FORWARD, tint = tokens.onColor, size = 20.dp)
                              Text(
                                  text = "+${skipIntervalSeconds}s",
                                  style = SpaceMonoBold11,
                                  color = tokens.onColor
                              )
                          }
                      }
                  }

                  // --------------------------------------------------------------------
                  // BOTTOM DECK: Timestamps + Loop Micro-Tuner (when active) + Progress Bar ONLY
                  // (Strictly NOTHING underneath the progress bar!)
                  // --------------------------------------------------------------------
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .align(Alignment.BottomCenter),
                      verticalArrangement = Arrangement.spacedBy(6.dp)
                  ) {
                      if (loopStartMs != null) {
                          LoopMicroTunerBar(
                              loopStartMs = loopStartMs,
                              loopEndMs = loopEndMs,
                              onAdjustA = onAdjustLoopA,
                              onAdjustB = onAdjustLoopB,
                              onSaveLoop = onSaveLoop,
                              onClearLoop = onClearLoop
                          )
                      }

                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          NeoBrutalistBox(
                              modifier = Modifier.height(30.dp),
                              fillColor = tokens.card,
                              cornerRadius = 8.dp,
                              shadowOffset = 2.dp
                          ) {
                              Text(
                                  text = FormatUtils.formatDurationMs(currentPositionMs),
                                  style = SpaceMonoBold12,
                                  color = tokens.ink,
                                  modifier = Modifier.padding(horizontal = 8.dp)
                              )
                          }

                          val remainingMs = (durationMs - currentPositionMs).coerceAtLeast(0L)
                          NeoBrutalistBox(
                              modifier = Modifier.height(30.dp),
                              fillColor = tokens.card,
                              cornerRadius = 8.dp,
                              shadowOffset = 2.dp
                          ) {
                              Text(
                                  text = "-${FormatUtils.formatDurationMs(remainingMs)} / ${FormatUtils.formatDurationMs(durationMs)}",
                                  style = SpaceMonoBold12,
                                  color = tokens.ink,
                                  modifier = Modifier.padding(horizontal = 8.dp)
                              )
                          }
                      }

                      // Snappy Zero-Lag Neo-Brutalist Progress Bar at the very bottom
                      FlagshipTimelineCanvas(
                          currentPositionMs = currentPositionMs,
                          durationMs = durationMs,
                          bufferedPercentage = bufferedPercentage,
                          loopStartMs = loopStartMs,
                          loopEndMs = loopEndMs,
                          bookmarks = bookmarks,
                          onScrub = onTimelineScrub,
                          onDragLoopBracket = onDragLoopBracket
                      )
                  }
              }
          }

          @Composable
          private fun NeoTopLeftQuickButton(
              icon: LucideGlyph,
              label: String,
              fillColor: Color,
              isHighlighted: Boolean,
              onClick: () -> Unit
          ) {
              val tokens = VdxTheme.tokens
              val textColor = if (isHighlighted) tokens.onColor else tokens.ink
              NeoBrutalistBox(
                  modifier = Modifier.height(38.dp),
                  fillColor = fillColor,
                  cornerRadius = 10.dp,
                  shadowOffset = 3.dp,
                  onClick = onClick
              ) {
                  Row(
                      modifier = Modifier.padding(horizontal = 10.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(6.dp)
                  ) {
                      LucideIcon(icon = icon, tint = textColor, size = 16.dp)
                      Text(text = label, style = SpaceMonoBold12, color = textColor)
                  }
              }
          }

          // ============================================================================
          // 2. SNAPPY NEO-BRUTALIST TIMELINE CANVAS & LOOP MICRO-TUNER
          // ============================================================================

          @Composable
          private fun LoopMicroTunerBar(
              loopStartMs: Long,
              loopEndMs: Long?,
              onAdjustA: (Long) -> Unit,
              onAdjustB: (Long) -> Unit,
              onSaveLoop: () -> Unit,
              onClearLoop: () -> Unit
          ) {
              val tokens = VdxTheme.tokens
              NeoBrutalistBox(
                  modifier = Modifier.fillMaxWidth().height(44.dp),
                  fillColor = tokens.card,
                  cornerRadius = 10.dp,
                  shadowOffset = 3.dp
              ) {
                  Row(
                      modifier = Modifier
                          .fillMaxSize()
                          .horizontalScroll(rememberScrollState())
                          .padding(horizontal = 10.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      MicroTunerChip(text = "A -0.1s", fill = tokens.paper, onClick = { onAdjustA(-100L) })
                      MicroTunerChip(text = "A +0.1s", fill = tokens.paper, onClick = { onAdjustA(100L) })

                      val endText = if (loopEndMs != null) FormatUtils.formatPreciseCentiseconds(loopEndMs) else "Set B"
                      Text(
                          text = "${FormatUtils.formatPreciseCentiseconds(loopStartMs)} - $endText",
                          style = SpaceMonoBold12,
                          color = tokens.ink
                      )

                      if (loopEndMs != null) {
                          MicroTunerChip(text = "B -0.1s", fill = tokens.paper, onClick = { onAdjustB(-100L) })
                          MicroTunerChip(text = "B +0.1s", fill = tokens.paper, onClick = { onAdjustB(100L) })
                          MicroTunerChip(text = "Save loop", fill = tokens.primary, isColored = true, onClick = onSaveLoop)
                      }
                      MicroTunerChip(text = "Clear", fill = tokens.danger, isColored = true, onClick = onClearLoop)
                  }
              }
          }

          @Composable
          private fun MicroTunerChip(
              text: String,
              fill: Color,
              isColored: Boolean = false,
              onClick: () -> Unit
          ) {
              val tokens = VdxTheme.tokens
              Box(
                  modifier = Modifier
                      .clip(RoundedCornerShape(6.dp))
                      .background(fill)
                      .border(2.dp, tokens.ink, RoundedCornerShape(6.dp))
                      .clickable { onClick() }
                      .padding(horizontal = 8.dp, vertical = 4.dp)
              ) {
                  Text(
                      text = text,
                      style = SpaceMonoBold11,
                      color = if (isColored) tokens.onColor else tokens.ink
                  )
              }
          }

          @Composable
          private fun FlagshipTimelineCanvas(
              currentPositionMs: Long,
              durationMs: Long,
              bufferedPercentage: Int,
              loopStartMs: Long?,
              loopEndMs: Long?,
              bookmarks: List<BookmarkEntity>,
              onScrub: (Long) -> Unit,
              onDragLoopBracket: (Long, Long) -> Unit
          ) {
              val tokens = VdxTheme.tokens
              val safeDuration = durationMs.coerceAtLeast(1L)
              val latestDur by rememberUpdatedState(safeDuration)
              val latestLoopA by rememberUpdatedState(loopStartMs)
              val latestLoopB by rememberUpdatedState(loopEndMs)

              // Local drag position for 0ms visual thumb response
              var isDraggingThumb by remember { mutableStateOf(false) }
              var localDragMs by remember { mutableLongStateOf(currentPositionMs) }
              val displayedPositionMs = if (isDraggingThumb) localDragMs else currentPositionMs

              Canvas(
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(36.dp)
                      .pointerInput(Unit) {
                          awaitEachGesture {
                              val down = awaitFirstDown(requireUnconsumed = false)
                              val widthPx = size.width.toFloat().coerceAtLeast(1f)
                              val startA = latestLoopA
                              val endB = latestLoopB

                              val aX = if (startA != null) (startA.toFloat() / latestDur.toFloat()) * widthPx else -100f
                              val bX = if (endB != null) (endB.toFloat() / latestDur.toFloat()) * widthPx else -100f

                              val draggingBracket = when {
                                  startA != null && endB != null && abs(down.position.x - aX) < 32f -> 1
                                  startA != null && endB != null && abs(down.position.x - bX) < 32f -> 2
                                  else -> 0
                              }

                              if (draggingBracket == 0) {
                                  isDraggingThumb = true
                                  val target = ((down.position.x / widthPx).coerceIn(0f, 1f) * latestDur).roundToLong()
                                  localDragMs = target
                                  onScrub(target)
                              }

                              do {
                                  val event = awaitPointerEvent()
                                  val change = event.changes.firstOrNull() ?: break
                                  if (change.pressed) {
                                      val frac = (change.position.x / widthPx).coerceIn(0f, 1f)
                                      if (draggingBracket == 1 && startA != null && endB != null) {
                                          val newA = (frac * latestDur).roundToLong().coerceAtMost(endB - 250L)
                                          onDragLoopBracket(newA, endB)
                                      } else if (draggingBracket == 2 && startA != null && endB != null) {
                                          val newB = (frac * latestDur).roundToLong().coerceAtLeast(startA + 250L)
                                          onDragLoopBracket(startA, newB)
                                      } else {
                                          val target = (frac * latestDur).roundToLong()
                                          localDragMs = target
                                          onScrub(target)
                                      }
                                      change.consume()
                                  }
                              } while (event.changes.any { it.pressed })

                              isDraggingThumb = false
                          }
                      }
              ) {
                  val canvasW = size.width
                  val centerY = size.height / 2f
                  val trackHeight = 14.dp.toPx()
                  val strokePx = 2.dp.toPx()
                  val corner = CornerRadius(6.dp.toPx())
                  val topY = centerY - trackHeight / 2f

                  // 1. Unplayed Background Track (card fill)
                  drawRoundRect(
                      color = tokens.card,
                      topLeft = Offset(0f, topY),
                      size = Size(canvasW, trackHeight),
                      cornerRadius = corner
                  )

                  // 2. Buffered Track (paper fill)
                  val bufWidth = (bufferedPercentage.coerceIn(0, 100) / 100f) * canvasW
                  if (bufWidth > 0f) {
                      drawRoundRect(
                          color = tokens.paper,
                          topLeft = Offset(0f, topY),
                          size = Size(bufWidth, trackHeight),
                          cornerRadius = corner
                      )
                  }

                  // 3. Active Played Track (primary fill)
                  val playedFraction = (displayedPositionMs.toFloat() / safeDuration.toFloat()).coerceIn(0f, 1f)
                  val playedWidth = playedFraction * canvasW
                  if (playedWidth > 0f) {
                      drawRoundRect(
                          color = tokens.primary,
                          topLeft = Offset(0f, topY),
                          size = Size(playedWidth, trackHeight),
                          cornerRadius = corner
                      )
                  }

                  // 4. A-B Loop Span
                  if (loopStartMs != null) {
                      val aX = ((loopStartMs.toFloat() / safeDuration.toFloat()).coerceIn(0f, 1f)) * canvasW
                      val bX = if (loopEndMs != null) {
                          ((loopEndMs.toFloat() / safeDuration.toFloat()).coerceIn(0f, 1f)) * canvasW
                      } else aX

                      if (loopEndMs != null && bX > aX) {
                          drawRect(
                              color = tokens.tertiary,
                              topLeft = Offset(aX, topY),
                              size = Size(bX - aX, trackHeight)
                          )
                      }
                      drawLine(
                          color = tokens.ink,
                          start = Offset(aX, centerY - 14.dp.toPx()),
                          end = Offset(aX, centerY + 14.dp.toPx()),
                          strokeWidth = 3.dp.toPx(),
                          cap = StrokeCap.Square
                      )
                      if (loopEndMs != null) {
                          drawLine(
                              color = tokens.ink,
                              start = Offset(bX, centerY - 14.dp.toPx()),
                              end = Offset(bX, centerY + 14.dp.toPx()),
                              strokeWidth = 3.dp.toPx(),
                              cap = StrokeCap.Square
                          )
                      }
                  }

                  // 5. Track 2dp Ink Border
                  drawRoundRect(
                      color = tokens.ink,
                      topLeft = Offset(0f, topY),
                      size = Size(canvasW, trackHeight),
                      cornerRadius = corner,
                      style = Stroke(width = strokePx)
                  )

                  // 6. Bookmark Square Markers
                  val pinSize = 8.dp.toPx()
                  for (bm in bookmarks) {
                      val bmX = ((bm.timestampMs.toFloat() / safeDuration.toFloat()).coerceIn(0f, 1f)) * canvasW
                      drawRect(
                          color = tokens.secondary,
                          topLeft = Offset(bmX - pinSize / 2f, topY - pinSize - 2.dp.toPx()),
                          size = Size(pinSize, pinSize)
                      )
                      drawRect(
                          color = tokens.ink,
                          topLeft = Offset(bmX - pinSize / 2f, topY - pinSize - 2.dp.toPx()),
                          size = Size(pinSize, pinSize),
                          style = Stroke(width = 1.5.dp.toPx())
                      )
                  }

                  // 7. Neo-Brutalist Square Playhead Thumb (18x26dp, radius 6dp, 2dp ink border)
                  val thumbW = 18.dp.toPx()
                  val thumbH = 26.dp.toPx()
                  val thumbX = (playedWidth - thumbW / 2f).coerceIn(0f, (canvasW - thumbW).coerceAtLeast(0f))
                  val thumbY = centerY - thumbH / 2f
                  drawRoundRect(
                      color = tokens.tertiary,
                      topLeft = Offset(thumbX, thumbY),
                      size = Size(thumbW, thumbH),
                      cornerRadius = CornerRadius(6.dp.toPx())
                  )
                  drawRoundRect(
                      color = tokens.ink,
                      topLeft = Offset(thumbX, thumbY),
                      size = Size(thumbW, thumbH),
                      cornerRadius = CornerRadius(6.dp.toPx()),
                      style = Stroke(width = strokePx)
                  )
              }
          }

          // ============================================================================
          // 3. DECODER MENU PICKER & TOP-RIGHT MAIN MENU DIALOGS
          // ============================================================================

          @Composable
          fun NeoDecoderMenuDialog(
              currentMode: DecoderMode,
              onSelectMode: (DecoderMode) -> Unit,
              onDismiss: () -> Unit
          ) {
              val tokens = VdxTheme.tokens
              Dialog(onDismissRequest = onDismiss) {
                  NeoBrutalistBox(
                      modifier = Modifier.fillMaxWidth(),
                      fillColor = tokens.card,
                      cornerRadius = 14.dp,
                      borderWidth = 3.dp,
                      shadowOffset = 6.dp
                  ) {
                      Column(
                          modifier = Modifier.fillMaxWidth().padding(16.dp),
                          verticalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          Text("Select decoder", style = SpaceGroteskSectionTitle, color = tokens.ink)
                          Text(
                              text = "Automatically falls back if a codec is unsupported.",
                              style = SpaceMonoRegular12,
                              color = tokens.muted
                          )
                          DecoderMode.entries.forEach { mode ->
                              val isSel = currentMode == mode
