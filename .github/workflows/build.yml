name: Build VDX Player APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vdx-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b682569dd4e08acf67170a2b42d829\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a578e44e3bb4530a66d34b880fb" > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Project from Source Text File
        run: |
          set -e
          SCRIPT_FILE=$(grep -l "settings.gradle.kts" *.txt *.sh 2>/dev/null | head -n 1)
          if [ -z "$SCRIPT_FILE" ]; then
            echo "Error: Could not find your source generator .txt or .sh file in the repository root."
            exit 1
          fi
          echo "Generating project from: $SCRIPT_FILE"
          tr -d '\r' < "$SCRIPT_FILE" | bash

      - name: Initialize Gradle Wrapper & Compile VDX Player Release APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload VDX Player APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VDX-Player-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
