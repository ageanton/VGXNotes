          @Composable
          fun FlagshipVideoPlayerTheme(
              themePalette: VdxThemePalette,
              content: @Composable () -> Unit
          ) {
              val tokens = remember(themePalette) { resolveVdxThemeTokens(themePalette) }
              val view = LocalView.current

              if (!view.isInEditMode) {
                  SideEffect {
                      val window = (view.context as? Activity)?.window ?: return@SideEffect
                      window.statusBarColor = tokens.paper.toArgb()
                      window.navigationBarColor = tokens.paper.toArgb()
                      val controller = WindowCompat.getInsetsController(window, view)
                      // Midnight uses light status/navigation bar icons; all other themes use dark ones
                      controller.isAppearanceLightStatusBars = !tokens.isDark
                      controller.isAppearanceLightNavigationBars = !tokens.isDark
                  }
              }

              val materialScheme = if (tokens.isDark) {
                  darkColorScheme(
                      primary = tokens.primary,
                      onPrimary = tokens.onColor,
                      secondary = tokens.secondary,
                      onSecondary = tokens.onColor,
                      tertiary = tokens.tertiary,
                      onTertiary = tokens.onColor,
                      background = tokens.paper,
                      onBackground = tokens.ink,
                      surface = tokens.card,
                      onSurface = tokens.ink,
                      error = tokens.danger,
                      onError = tokens.onColor
                  )
              } else {
                  lightColorScheme(
                      primary = tokens.primary,
                      onPrimary = tokens.onColor,
                      secondary = tokens.secondary,
                      onSecondary = tokens.onColor,
                      tertiary = tokens.tertiary,
                      onTertiary = tokens.onColor,
                      background = tokens.paper,
                      onBackground = tokens.ink,
                      surface = tokens.card,
                      onSurface = tokens.ink,
                      error = tokens.danger,
                      onError = tokens.onColor
                  )
              }

              CompositionLocalProvider(LocalVdxTokens provides tokens) {
                  MaterialTheme(
                      colorScheme = materialScheme,
                      typography = Typography(
                          headlineLarge = SpaceGroteskScreenTitle,
                          headlineMedium = SpaceGroteskSectionTitle,
                          titleLarge = SpaceGroteskSectionTitle,
                          titleMedium = SpaceGroteskBody16,
                          titleSmall = SpaceGroteskItem15,
                          bodyLarge = SpaceGroteskBody16,
                          bodyMedium = SpaceGroteskItem15,
                          bodySmall = SpaceMonoRegular13,
                          labelLarge = SpaceMonoBold14,
                          labelMedium = SpaceMonoRegular13,
                          labelSmall = SpaceMonoRegular12
                      ),
                      content = content
                  )
              }
          }

          // ============================================================================
          // 3. NEO-BRUTALIST PRIMITIVE COMPONENTS (2DP INK BORDER, HARD SHADOW, 80MS PRESS)
          // ============================================================================

          /**
           * Raised Neo-Brutalist surface or button with a zero-blur hard offset shadow.
           * - Default shadow offset: 4.dp (or 5.dp for large cards, 3.dp for ticker buttons).
           * - Pressed or permanently selected state: moves 2.dp right and 2.dp down, shadow shrinks to 0.dp in 80ms linear.
           * - Never clips its hard shadow.
           */
          @Composable
          fun NeoBrutalistBox(
              modifier: Modifier = Modifier,
              fillColor: Color,
              borderColor: Color = VdxTheme.tokens.ink,
              shadowColor: Color = VdxTheme.tokens.ink,
              cornerRadius: Dp = 10.dp,
              borderWidth: Dp = 2.dp,
              shadowOffset: Dp = 4.dp,
              isSelectedOrPressedPermanently: Boolean = false,
              enabled: Boolean = true,
              contentDescriptionText: String? = null,
              onClick: (() -> Unit)? = null,
              contentAlignment: Alignment = Alignment.Center,
              content: @Composable BoxScope.() -> Unit
          ) {
              val interactionSource = remember { MutableInteractionSource() }
              val isPressed by interactionSource.collectIsPressedAsState()
              val activeDepressed = isSelectedOrPressedPermanently || (enabled && isPressed)

              val animSpec = tween<Dp>(durationMillis = 80, easing = LinearEasing)
              val translateOffset by animateDpAsState(
                  targetValue = if (activeDepressed) 2.dp else 0.dp,
                  animationSpec = animSpec,
                  label = "NeoTranslate"
              )
              val currentShadowOffset by animateDpAsState(
                  targetValue = if (activeDepressed) 0.dp else shadowOffset,
                  animationSpec = animSpec,
                  label = "NeoShadow"
              )

              val shape = RoundedCornerShape(cornerRadius)
              val semanticsMod = if (contentDescriptionText != null) {
                  Modifier.semantics { contentDescription = contentDescriptionText }
              } else Modifier

              val clickMod = if (onClick != null && enabled) {
                  Modifier.clickable(
                      interactionSource = interactionSource,
                      indication = null,
                      onClick = onClick
                  )
              } else Modifier

              Box(
                  modifier = modifier
                      .then(semanticsMod)
                      .padding(end = shadowOffset, bottom = shadowOffset)
              ) {
                  // Hard Offset Shadow Layer (Zero blur)
                  if (currentShadowOffset > 0.dp) {
                      Box(
                          modifier = Modifier
                              .matchParentSize()
                              .offset {
                                  IntOffset(
                                      x = currentShadowOffset.roundToPx(),
                                      y = currentShadowOffset.roundToPx()
                                  )
                              }
                              .background(shadowColor, shape)
                      )
                  }

                  // Foreground Container with 2dp Border
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .offset {
                              IntOffset(
                                  x = translateOffset.roundToPx(),
                                  y = translateOffset.roundToPx()
                              )
                          }
                          .clip(shape)
                          .background(fillColor, shape)
                          .border(borderWidth, borderColor, shape)
                          .then(clickMod),
                      contentAlignment = contentAlignment,
                      content = content
                  )
              }
          }

          /**
           * Neo-Brutalist Switch: 52x30dp track, 2dp ink border, radius 10dp;
           * off = card, on = primary; thumb is a 22dp square, radius 6dp, ink fill, with a 2dp border.
           */
          @Composable
          fun NeoSwitch(
              checked: Boolean,
              onCheckedChange: (Boolean) -> Unit,
              modifier: Modifier = Modifier
          ) {
              val tokens = VdxTheme.tokens
              val thumbX by animateDpAsState(
                  targetValue = if (checked) 24.dp else 4.dp,
                  animationSpec = tween(durationMillis = 80, easing = LinearEasing),
                  label = "NeoSwitchThumb"
              )
              Box(
                  modifier = modifier
                      .sizeIn(minWidth = 48.dp, minHeight = 48.dp)
                      .clickable(
                          interactionSource = remember { MutableInteractionSource() },
                          indication = null
                      ) { onCheckedChange(!checked) },
                  contentAlignment = Alignment.Center
              ) {
                  Box(
                      modifier = Modifier
                          .size(width = 52.dp, height = 30.dp)
                          .clip(RoundedCornerShape(10.dp))
                          .background(if (checked) tokens.primary else tokens.card)
                          .border(2.dp, tokens.ink, RoundedCornerShape(10.dp)),
                      contentAlignment = Alignment.CenterStart
                  ) {
                      Box(
                          modifier = Modifier
                              .offset(x = thumbX)
                              .size(22.dp)
                              .clip(RoundedCornerShape(6.dp))
                              .background(tokens.ink)
                              .border(2.dp, tokens.ink, RoundedCornerShape(6.dp))
                      )
                  }
              }
          }

          /**
           * Neo-Brutalist Checkbox: 24dp square, 2dp border, radius 6dp;
           * checked = primary fill with an onColor check.
           */
          @Composable
          fun NeoCheckbox(
              checked: Boolean,
              onCheckedChange: (Boolean) -> Unit,
              modifier: Modifier = Modifier
          ) {
              val tokens = VdxTheme.tokens
              Box(
                  modifier = modifier
                      .size(48.dp)
                      .clickable(
                          interactionSource = remember { MutableInteractionSource() },
                          indication = null
                      ) { onCheckedChange(!checked) },
                  contentAlignment = Alignment.Center
              ) {
                  Box(
                      modifier = Modifier
                          .size(24.dp)
                          .clip(RoundedCornerShape(6.dp))
                          .background(if (checked) tokens.primary else tokens.card)
                          .border(2.dp, tokens.ink, RoundedCornerShape(6.dp)),
                      contentAlignment = Alignment.Center
                  ) {
                      if (checked) {
                          LucideIcon(
                              icon = LucideGlyph.CHECK,
                              tint = tokens.onColor,
                              size = 16.dp
                          )
                      }
                  }
              }
          }

          /**
           * Neo-Brutalist Radio: 24dp square, 2dp border, radius 6dp;
           * filled inner square when selected.
           */
          @Composable
          fun NeoRadioButton(
              selected: Boolean,
              onClick: () -> Unit,
              modifier: Modifier = Modifier
          ) {
              val tokens = VdxTheme.tokens
              Box(
                  modifier = modifier
                      .size(48.dp)
                      .clickable(
                          interactionSource = remember { MutableInteractionSource() },
                          indication = null
                      ) { onClick() },
                  contentAlignment = Alignment.Center
              ) {
                  Box(
                      modifier = Modifier
                          .size(24.dp)
                          .clip(RoundedCornerShape(6.dp))
                          .background(if (selected) tokens.primary else tokens.card)
                          .border(2.dp, tokens.ink, RoundedCornerShape(6.dp)),
                      contentAlignment = Alignment.Center
                  ) {
                      if (selected) {
                          Box(
                              modifier = Modifier
                                  .size(10.dp)
                                  .clip(RoundedCornerShape(2.dp))
                                  .background(tokens.onColor)
                          )
                      }
                  }
              }
          }

          /**
           * Neo-Brutalist Flat Slider matching the player progress bar style (no round thumb, 2dp ink border).
           */
          @Composable
          fun NeoSlider(
              value: Float,
              onValueChange: (Float) -> Unit,
              valueRange: ClosedFloatingPointRange<Float> = 0f..1f,
              modifier: Modifier = Modifier
          ) {
              val tokens = VdxTheme.tokens
              val span = (valueRange.endInclusive - valueRange.start).coerceAtLeast(0.0001f)
              val fraction = ((value - valueRange.start) / span).coerceIn(0f, 1f)

              Canvas(
                  modifier = modifier
                      .fillMaxWidth()
                      .height(36.dp)
                      .pointerInput(valueRange) {
                          detectTapGestures { offset ->
                              val f = (offset.x / size.width.toFloat().coerceAtLeast(1f)).coerceIn(0f, 1f)
                              onValueChange(valueRange.start + f * span)
                          }
                      }
                      .pointerInput(valueRange) {
                          detectHorizontalDragGestures { change, _ ->
                              change.consume()
                              val f = (change.position.x / size.width.toFloat().coerceAtLeast(1f)).coerceIn(0f, 1f)
                              onValueChange(valueRange.start + f * span)
                          }
                      }
              ) {
                  val trackH = 12.dp.toPx()
                  val strokePx = 2.dp.toPx()
                  val topY = (size.height - trackH) / 2f
                  val corner = CornerRadius(6.dp.toPx())

                  // Background Track
                  drawRoundRect(
                      color = tokens.card,
                      topLeft = Offset(0f, topY),
                      size = Size(size.width, trackH),
                      cornerRadius = corner
                  )
                  // Active Primary Fill
                  val activeW = (size.width * fraction).coerceAtLeast(0f)
                  if (activeW > 0f) {
                      drawRoundRect(
                          color = tokens.primary,
                          topLeft = Offset(0f, topY),
                          size = Size(activeW, trackH),
                          cornerRadius = corner
                      )
                  }
                  // Track 2dp Ink Border
                  drawRoundRect(
                      color = tokens.ink,
                      topLeft = Offset(0f, topY),
                      size = Size(size.width, trackH),
                      cornerRadius = corner,
                      style = Stroke(width = strokePx)
                  )
                  // Square Thumb (18x24dp, radius 6dp, 2dp ink border)
                  val thumbW = 16.dp.toPx()
                  val thumbH = 24.dp.toPx()
                  val thumbX = (activeW - thumbW / 2f).coerceIn(0f, (size.width - thumbW).coerceAtLeast(0f))
                  val thumbY = (size.height - thumbH) / 2f
                  drawRoundRect(
                      color = tokens.tertiary,
                      topLeft = Offset(thumbX, thumbY),
                      size = Size(thumbW, thumbH),
                      cornerRadius = CornerRadius(6.dp.toPx())
                  )
                  drawRoundRect(
                      color = tokens.ink,
                      topLeft = Offset(thumbX, thumbY),
                      size = Size(thumbW, thumbH),
                      cornerRadius = CornerRadius(6.dp.toPx()),
                      style = Stroke(width = strokePx)
                  )
              }
          }

          // ============================================================================
          // 4. UNIFIED LUCIDE / TABLER 2DP STROKE OUTLINE ICON SET
          // ============================================================================

          enum class LucideGlyph {
              CLOUD,
              SETTINGS,
              SEARCH,
              CLEAR_X,
              ARROWS_SORT,
              FOLDER,
              LIST,
              GRID_2X2,
              DOTS_3X3,
              BACK,
              CHEVRON_RIGHT,
              CHEVRON_DOWN,
              CHEVRON_UP,
              TRASH,
              RESTORE,
              CHECK,
              PLAY,
              PAUSE,
              SKIP_BACK,
              SKIP_FORWARD,
              LOCK,
              UNLOCK,
              CPU_DECODER,
              MENU_MORE,
              BOOKMARK,
              REPEAT_LOOP,
              SPEED_GAUGE,
              ROTATE_ORIENTATION,
              ASPECT_FRAME,
              SUBTITLES,
              AUDIO_WAVE,
              VOLUME_MUTE,
              PIP_WINDOW,
              STATS_PULSE,
              EDIT_PENCIL,
              PLUS,
              SUN_BRIGHTNESS
          }

          @Composable
          fun LucideIcon(
              icon: LucideGlyph,
              tint: Color = VdxTheme.tokens.ink,
              size: Dp = 20.dp,
              contentDescriptionText: String? = null,
              modifier: Modifier = Modifier
          ) {
              val semMod = if (contentDescriptionText != null) {
                  Modifier.semantics { contentDescription = contentDescriptionText }
              } else Modifier

              Canvas(modifier = modifier.size(size).then(semMod)) {
                  val s = this.size.minDimension
                  val stroke = Stroke(
                      width = 2.dp.toPx(),
                      cap = StrokeCap.Round,
                      join = StrokeJoin.Round
                  )
                  drawLucideGlyph(icon, s, tint, stroke)
              }
          }

          private fun DrawScope.drawLucideGlyph(
              icon: LucideGlyph,
              s: Float,
              color: Color,
              stroke: Stroke
          ) {
              when (icon) {
                  LucideGlyph.CLOUD -> {
                      val p = Path().apply {
                          moveTo(s * 0.25f, s * 0.76f)
                          lineTo(s * 0.76f, s * 0.76f)
                          cubicTo(s * 0.90f, s * 0.76f, s * 0.92f, s * 0.52f, s * 0.76f, s * 0.48f)
                          cubicTo(s * 0.72f, s * 0.24f, s * 0.36f, s * 0.22f, s * 0.30f, s * 0.44f)
                          cubicTo(s * 0.12f, s * 0.46f, s * 0.10f, s * 0.76f, s * 0.25f, s * 0.76f)
                      }
                      drawPath(p, color, style = stroke)
                  }
                  LucideGlyph.SETTINGS -> {
                      drawCircle(color, radius = s * 0.16f, center = Offset(s * 0.5f, s * 0.5f), style = stroke)
                      drawCircle(color, radius = s * 0.34f, center = Offset(s * 0.5f, s * 0.5f), style = stroke)
                      drawLine(color, Offset(s * 0.5f, s * 0.08f), Offset(s * 0.5f, s * 0.18f), stroke.width, StrokeCap.Round)
                      drawLine(color, Offset(s * 0.5f, s * 0.82f), Offset(s * 0.5f, s * 0.92f), stroke.width, StrokeCap.Round)
                      drawLine(color, Offset(s * 0.08f, s * 0.5f), Offset(s * 0.18f, s * 0.5f), stroke.width, StrokeCap.Round)
                      drawLine(color, Offset(s * 0.82f, s * 0.5f), Offset(s * 0.92f, s * 0.5f), stroke.width, StrokeCap.Round)
                  }
                  LucideGlyph.SEARCH -> {
                      drawCircle(color, radius = s * 0.28f, center = Offset(s * 0.44f, s * 0.44f), style = stroke)
                      drawLine(color, Offset(s * 0.65f, s * 0.65f), Offset(s * 0.86f, s * 0.86f), stroke.width, StrokeCap.Round)
                  }
                  LucideGlyph.CLEAR_X -> {
                      drawLine(color, Offset(s * 0.26f, s * 0.26f), Offset(s * 0.74f, s * 0.74f), stroke.width, StrokeCap.Round)
                      drawLine(color, Offset(s * 0.74f, s * 0.26f), Offset(s * 0.26f, s * 0.74f), stroke.width, StrokeCap.Round)
                  }
                  LucideGlyph.ARROWS_SORT -> {
                      // Up arrow on left
                      drawLine(color, Offset(s * 0.32f, s * 0.20f), Offset(s * 0.32f, s * 0.80f), stroke.width, StrokeCap.Round)
                      drawLine(color, Offset(s * 0.18f, s * 0.36f), Offset(s * 0.32f, s * 0.20f), stroke.width, StrokeCap.Round)
                      drawLine(color, Offset(s * 0.46f, s * 0.36f), Offset(s * 0.32f, s * 0.20f), stroke.width, StrokeCap.Round)
                      // Down arrow on right
                      drawLine(color, Offset(s * 0.68f, s * 0.20f), Offset(s * 0.68f, s * 0.80f), stroke.width, StrokeCap.Round)
                      drawLine(color, Offset(s * 0.54f, s * 0.64f), Offset(s * 0.68f, s * 0.80f), stroke.width, StrokeCap.Round)
                      drawLine(color, Offset(s * 0.82f, s * 0.64f), Offset(s * 0.68f, s * 0.80f), stroke.width, StrokeCap.Round)
                  }
                  LucideGlyph.FOLDER -> {
                      val p = Path().apply {
                          moveTo(s * 0.14f, s * 0.26f)
                          lineTo(s * 0.40f, s * 0.26f)
                          lineTo(s * 0.48f, s * 0.36f)
                          lineTo(s * 0.86f, s * 0.36f)
                          lineTo(s * 0.86f, s * 0.78f)
                          lineTo(s * 0.14f, s * 0.78f)
                          close()
                      }
                      drawPath(p, color, style = stroke)
                  }
                  LucideGlyph.LIST -> {
                      for (yFrac in listOf(0.28f, 0.50f, 0.72f)) {
                          drawLine(color, Offset(s * 0.18f, s * yFrac), Offset(s * 0.22f, s * yFrac), stroke.width * 1.3f, StrokeCap.Round)
