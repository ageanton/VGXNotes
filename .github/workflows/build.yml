                      </intent-filter>
                  </activity-alias>

                  <activity-alias
                      android:name=".LauncherGold"
                      android:enabled="false"
                      android:exported="true"
                      android:icon="@drawable/ic_vdx_gold"
                      android:roundIcon="@drawable/ic_vdx_gold"
                      android:label="VDX Player"
                      android:targetActivity=".MainActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
