                      // Row 2: Compact Rounded Symbol Buttons Directly Under Title (Never collides in Portrait)
                      if (enabledTopLeftSlots.isNotEmpty()) {
                          LazyRow(
                              horizontalArrangement = Arrangement.spacedBy(8.dp),
                              verticalAlignment = Alignment.CenterVertically,
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(start = 48.dp)
