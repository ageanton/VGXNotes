                                              loopEndMs == null -> "A"
                                              else -> "A-B"
                                          }
                                          OsdRoundedIconButton(
                                              icon = Icons.Default.Repeat,
                                              badgeText = loopBadge,
                                              isHighlighted = loopStartMs != null,
