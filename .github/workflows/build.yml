          @Composable
          private fun NeoNetworkStreamBottomSheet(
              streamHistory: List<NetworkStreamHistoryEntity>,
              onLaunchStream: (String, String, String, String, Map<String, String>) -> Unit,
              onDeleteHistory: (NetworkStreamHistoryEntity) -> Unit,
              onDismiss: () -> Unit
          ) {
              val tokens = VdxTheme.tokens
              var streamUrl by remember { mutableStateOf("") }
              var streamTitle by remember { mutableStateOf("") }
              var showHeaders by remember { mutableStateOf(false) }
              var userAgent by remember { mutableStateOf("") }
              var referer by remember { mutableStateOf("") }
              var rawHeaders by remember { mutableStateOf("") }

              ModalBottomSheet(
                  onDismissRequest = onDismiss,
                  containerColor = tokens.card,
                  scrimColor = tokens.scrim,
                  shape = RoundedCornerShape(topStart = 14.dp, topEnd = 14.dp),
                  dragHandle = {
                      Column(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Box(modifier = Modifier.fillMaxWidth().height(3.dp).background(tokens.ink))
                          Spacer(Modifier.height(10.dp))
                          // 40x6dp ink handle bar
                          Box(
                              modifier = Modifier
                                  .size(width = 40.dp, height = 6.dp)
                                  .clip(RoundedCornerShape(3.dp))
                                  .background(tokens.ink)
                          )
                          Spacer(Modifier.height(10.dp))
                      }
                  }
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .verticalScroll(rememberScrollState())
                          .padding(horizontal = 16.dp, vertical = 8.dp)
                          .navigationBarsPadding(),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Text("Network stream", style = SpaceGroteskSectionTitle, color = tokens.ink)

                      NeoInputField(
                          value = streamUrl,
                          onValueChange = { streamUrl = it },
                          placeholder = "Stream url (https://, .m3u8, .mpd, rtsp://)"
                      )
                      NeoInputField(
                          value = streamTitle,
                          onValueChange = { streamTitle = it },
                          placeholder = "Optional stream title"
                      )

                      NeoBrutalistBox(
                          modifier = Modifier.fillMaxWidth().height(46.dp),
                          fillColor = tokens.secondary,
                          cornerRadius = 10.dp,
                          shadowOffset = 3.dp,
                          onClick = { showHeaders = !showHeaders }
                      ) {
                          Text(
                              text = if (showHeaders) "Hide custom headers" else "Custom headers & user-agent",
                              style = SpaceMonoBold12,
                              color = tokens.onColor
                          )
                      }

                      if (showHeaders) {
                          NeoInputField(
                              value = userAgent,
                              onValueChange = { userAgent = it },
                              placeholder = "User-agent header"
                          )
                          NeoInputField(
                              value = referer,
                              onValueChange = { referer = it },
                              placeholder = "Referer url"
                          )
                          NeoInputField(
                              value = rawHeaders,
                              onValueChange = { rawHeaders = it },
                              placeholder = "Header: Value (one per line)"
                          )
                      }

                      NeoBrutalistBox(
                          modifier = Modifier.fillMaxWidth().height(52.dp),
                          fillColor = tokens.primary,
                          cornerRadius = 10.dp,
                          shadowOffset = 4.dp,
                          enabled = streamUrl.isNotBlank(),
                          onClick = {
                              val parsed = rawHeaders.lines().mapNotNull { line ->
                                  val i = line.indexOf(':')
                                  if (i > 0) line.substring(0, i).trim() to line.substring(i + 1).trim() else null
                              }.toMap()
                              onLaunchStream(streamUrl, streamTitle, userAgent, referer, parsed)
                          }
                      ) {
                          Text("Play network stream", style = SpaceGroteskBody16, color = tokens.onColor)
                      }

                      if (streamHistory.isNotEmpty()) {
                          Text("Recent streams", style = SpaceMonoRegular12, color = tokens.muted)
                          streamHistory.forEach { item ->
                              NeoBrutalistBox(
                                  modifier = Modifier.fillMaxWidth().height(64.dp),
                                  fillColor = tokens.paper,
                                  cornerRadius = 10.dp,
                                  shadowOffset = 3.dp,
                                  onClick = {
                                      onLaunchStream(
                                          item.streamUrl,
                                          item.title,
                                          item.userAgent,
                                          item.referer,
                                          item.parsedHeaders()
                                      )
                                  }
                              ) {
                                  Row(
                                      modifier = Modifier.fillMaxSize().padding(horizontal = 12.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Column(modifier = Modifier.weight(1f)) {
                                          Text(item.title, style = SpaceGroteskItem15, color = tokens.ink, maxLines = 1)
                                          Text(item.streamUrl, style = SpaceMonoRegular12, color = tokens.muted, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                      }
                                      Box(
                                          modifier = Modifier
                                              .size(36.dp)
                                              .clickable { onDeleteHistory(item) },
                                          contentAlignment = Alignment.Center
                                      ) {
                                          LucideIcon(LucideGlyph.TRASH, tint = tokens.ink, size = 18.dp)
                                      }
                                  }
                              }
                          }
                      }
                      Spacer(Modifier.height(16.dp))
                  }
              }
          }

          @Composable
          private fun NeoInputField(
              value: String,
              onValueChange: (String) -> Unit,
              placeholder: String
          ) {
              val tokens = VdxTheme.tokens
              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(50.dp)
                      .clip(RoundedCornerShape(10.dp))
                      .background(tokens.paper)
                      .border(2.dp, tokens.ink, RoundedCornerShape(10.dp))
                      .padding(horizontal = 14.dp),
                  contentAlignment = Alignment.CenterStart
              ) {
                  if (value.isEmpty()) {
                      Text(placeholder, style = SpaceMonoRegular14, color = tokens.muted, maxLines = 1)
                  }
                  BasicTextField(
                      value = value,
                      onValueChange = onValueChange,
                      singleLine = true,
                      textStyle = SpaceMonoRegular14.copy(color = tokens.ink),
                      cursorBrush = SolidColor(tokens.ink),
                      modifier = Modifier.fillMaxWidth()
                  )
              }
          }
