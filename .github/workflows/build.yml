          @Composable
          private fun NetworkStreamModalSheet(
              streamHistory: List<NetworkStreamHistoryEntity>,
              onLaunchStream: (String, String, String, String, Map<String, String>) -> Unit,
              onDeleteHistory: (NetworkStreamHistoryEntity) -> Unit,
              onDismiss: () -> Unit
          ) {
              val tokens = LocalVdxTokens.current
              var streamUrl by remember { mutableStateOf("") }
              var streamTitle by remember { mutableStateOf("") }
              var showAdvancedHeaders by remember { mutableStateOf(false) }
              var userAgent by remember { mutableStateOf("") }
              var referer by remember { mutableStateOf("") }
              var rawCustomHeaders by remember { mutableStateOf("") }

              ModalBottomSheet(
                  onDismissRequest = onDismiss,
                  containerColor = tokens.card
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .verticalScroll(rememberScrollState())
                          .padding(horizontal = 20.dp, vertical = 8.dp)
                          .navigationBarsPadding(),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Text("Network stream", style = MaterialTheme.typography.titleLarge, color = tokens.ink)

                      OutlinedTextField(
                          value = streamUrl,
                          onValueChange = { streamUrl = it },
                          label = { Text("Stream URL (https://, .m3u8, .mpd, .mkv, rtsp://)") },
                          singleLine = true,
                          modifier = Modifier.fillMaxWidth()
                      )

                      OutlinedTextField(
                          value = streamTitle,
                          onValueChange = { streamTitle = it },
                          label = { Text("Optional display title") },
                          singleLine = true,
                          modifier = Modifier.fillMaxWidth()
                      )

                      TextButton(
                          onClick = { showAdvancedHeaders = !showAdvancedHeaders },
                          modifier = Modifier.align(Alignment.Start)
                      ) {
                          Text("Custom User-Agent, Referer & HTTP headers")
                      }

                      AnimatedVisibility(visible = showAdvancedHeaders) {
                          Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              OutlinedTextField(
                                  value = userAgent,
                                  onValueChange = { userAgent = it },
                                  label = { Text("Custom User-Agent") },
                                  singleLine = true,
                                  modifier = Modifier.fillMaxWidth()
                              )
                              OutlinedTextField(
                                  value = referer,
                                  onValueChange = { referer = it },
                                  label = { Text("Custom Referer") },
                                  singleLine = true,
                                  modifier = Modifier.fillMaxWidth()
                              )
                              OutlinedTextField(
                                  value = rawCustomHeaders,
                                  onValueChange = { rawCustomHeaders = it },
                                  label = { Text("HTTP headers (Key: Value per line)") },
                                  minLines = 2,
                                  maxLines = 4,
                                  modifier = Modifier.fillMaxWidth()
                              )
                          }
                      }

                      Button(
                          onClick = {
                              if (streamUrl.isNotBlank()) {
                                  val parsedHeaders = rawCustomHeaders.lines()
                                      .mapNotNull { line ->
                                          val idx = line.indexOf(':')
                                          if (idx > 0) line.substring(0, idx).trim() to line.substring(idx + 1).trim()
                                          else null
                                      }.toMap()
                                  onLaunchStream(streamUrl, streamTitle, userAgent, referer, parsedHeaders)
                              }
                          },
                          enabled = streamUrl.isNotBlank(),
                          modifier = Modifier.fillMaxWidth().height(48.dp),
                          shape = RoundedCornerShape(10.dp)
                      ) {
                          Text("Play stream", color = tokens.onColor)
                      }

                      if (streamHistory.isNotEmpty()) {
                          HorizontalDivider()
                          Text("Recent streams", style = MaterialTheme.typography.titleSmall, color = tokens.ink)
                          streamHistory.forEach { item ->
                              Surface(
                                  shape = RoundedCornerShape(10.dp),
                                  color = tokens.paper,
                                  onClick = {
                                      onLaunchStream(
                                          item.streamUrl,
                                          item.title,
                                          item.userAgent,
                                          item.referer,
                                          item.parsedHeaders()
                                      )
                                  },
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Row(
                                      modifier = Modifier.padding(12.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Column(modifier = Modifier.weight(1f)) {
                                          Text(item.title, style = MaterialTheme.typography.bodyMedium, fontWeight = FontWeight.Bold, color = tokens.ink, maxLines = 1)
                                          Text(item.streamUrl, style = MaterialTheme.typography.bodySmall, color = tokens.muted, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                      }
                                      IconButton(onClick = { onDeleteHistory(item) }) {
                                          Icon(Icons.Default.Close, contentDescription = "Delete", tint = tokens.ink, modifier = Modifier.size(18.dp))
                                      }
                                  }
                              }
                          }
                      }
                      Spacer(Modifier.height(16.dp))
                  }
              }
          }

          @Composable
          private fun TrashBinModalSheet(
              trashedVideos: List<TrashedVideoEntity>,
              onRestore: (TrashedVideoEntity) -> Unit,
              onDeleteForever: (TrashedVideoEntity) -> Unit,
              onEmptyTrash: () -> Unit,
              onDismiss: () -> Unit
          ) {
              val tokens = LocalVdxTokens.current
              ModalBottomSheet(
                  onDismissRequest = onDismiss,
                  containerColor = tokens.card
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 20.dp, vertical = 8.dp)
                          .navigationBarsPadding(),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          Text("Recycle bin", style = MaterialTheme.typography.titleLarge, color = tokens.ink)
                          if (trashedVideos.isNotEmpty()) {
                              TextButton(onClick = onEmptyTrash) {
                                  Text("Empty", color = tokens.danger)
                              }
                          }
                      }

