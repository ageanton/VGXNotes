                  if (_loopStartMs.value == null) {
                      _loopStartMs.value = now
                      _loopEndMs.value = null
                      _isLoopEditorVisible.value = true
                      viewModelScope.launch {
                          _toastBanner.emit("Point A set • Tap Set B in loop bar")
