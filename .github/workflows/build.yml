                                      style = MaterialTheme.typography.bodySmall,
                                      color = tokens.muted,
                                      maxLines = 1
                                  )
                              }

                              Icon(
                                  Icons.Default.ChevronRight,
                                  contentDescription = null,
                                  tint = tokens.muted
                              )
                          }
                      }
                  }
              }
          }

