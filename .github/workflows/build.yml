                      </intent-filter>
                  </activity-alias>

                  <activity-alias
                      android:name=".LauncherViolet"
                      android:enabled="false"
                      android:exported="true"
                      android:icon="@drawable/ic_vdx_violet"
                      android:roundIcon="@drawable/ic_vdx_violet"
                      android:label="VDX Player"
                      android:targetActivity=".MainActivity">
                      <intent-filter>
