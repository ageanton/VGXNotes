          @Composable
          private fun NeoSettingsScreen(
              prefs: AppPreferencesState,
              trashedCount: Int,
              onBack: () -> Unit,
              onOpenRecycleBin: () -> Unit,
              onSelectTheme: (VdxThemePalette) -> Unit,
              onSelectDecoder: (DecoderMode) -> Unit,
              onSetHoldSpeed: (Float) -> Unit,
              onSetSkipSeconds: (Int) -> Unit,
              onSetAutoPip: (Boolean) -> Unit,
              onSetBgAudio: (Boolean) -> Unit
          ) {
              val tokens = VdxTheme.tokens
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(tokens.paper)
                      .statusBarsPadding()
                      .navigationBarsPadding()
              ) {
                  // Top Bar: 40dp back button (secondary fill) and title "Settings" in Space Grotesk Bold 28sp
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 16.dp, vertical = 12.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Box(modifier = Modifier.size(48.dp), contentAlignment = Alignment.Center) {
                          NeoBrutalistBox(
                              modifier = Modifier.size(44.dp),
                              fillColor = tokens.secondary,
                              borderColor = tokens.ink,
                              shadowColor = tokens.ink,
                              cornerRadius = 10.dp,
                              borderWidth = 2.dp,
                              shadowOffset = 4.dp,
                              contentDescriptionText = "Back",
                              onClick = onBack
                          ) {
                              LucideIcon(LucideGlyph.BACK, tint = tokens.onColor, size = 20.dp)
                          }
                      }
                      Spacer(Modifier.width(12.dp))
                      Text(
                          text = "Settings",
                          style = SpaceGroteskScreenTitle,
                          color = tokens.ink
                      )
                  }

                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .verticalScroll(rememberScrollState())
                          .padding(horizontal = 16.dp, vertical = 8.dp),
                      verticalArrangement = Arrangement.spacedBy(16.dp)
                  ) {
                      // 1. FIRST ITEM AT VERY TOP: "Recycle bin" row with trash icon in 40dp secondary tile and chevron-right
                      NeoBrutalistBox(
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(68.dp),
                          fillColor = tokens.card,
                          borderColor = tokens.ink,
                          shadowColor = tokens.ink,
                          cornerRadius = 14.dp,
                          borderWidth = 2.dp,
                          shadowOffset = 4.dp,
                          onClick = onOpenRecycleBin
                      ) {
                          Row(
                              modifier = Modifier
                                  .fillMaxSize()
                                  .padding(horizontal = 14.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Box(
                                  modifier = Modifier
                                      .size(40.dp)
                                      .clip(RoundedCornerShape(10.dp))
                                      .background(tokens.secondary)
                                      .border(2.dp, tokens.ink, RoundedCornerShape(10.dp)),
                                  contentAlignment = Alignment.Center
                              ) {
                                  LucideIcon(LucideGlyph.TRASH, tint = tokens.onColor, size = 20.dp)
                              }
                              Spacer(Modifier.width(12.dp))
                              Column(modifier = Modifier.weight(1f)) {
                                  Text("Recycle bin", style = SpaceGroteskBody16, color = tokens.ink)
                                  Text(
                                      text = if (trashedCount == 1) "1 item in trash" else "$trashedCount items in trash",
                                      style = SpaceMonoRegular12,
                                      color = tokens.muted
                                  )
                              }
                              LucideIcon(LucideGlyph.CHEVRON_RIGHT, tint = tokens.ink, size = 20.dp)
                          }
                      }

                      // 2. SECOND ITEM: "Color theme" card showing all 6 themes in a 2-column grid, 12dp gaps
                      Text("Color theme", style = SpaceMonoRegular12, color = tokens.muted)
                      NeoBrutalistBox(
                          modifier = Modifier.fillMaxWidth(),
                          fillColor = tokens.card,
                          borderColor = tokens.ink,
                          shadowColor = tokens.ink,
                          cornerRadius = 14.dp,
                          borderWidth = 2.dp,
                          shadowOffset = 4.dp
                      ) {
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(14.dp),
                              verticalArrangement = Arrangement.spacedBy(12.dp)
                          ) {
                              val themeRows = VdxThemePalette.entries.chunked(2)
                              themeRows.forEach { pair ->
                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalArrangement = Arrangement.spacedBy(12.dp)
                                  ) {
                                      pair.forEach { themeOption ->
                                          val optTokens = resolveVdxThemeTokens(themeOption)
                                          val isSelected = prefs.themePalette == themeOption

                                          NeoBrutalistBox(
                                              modifier = Modifier
                                                  .weight(1f)
                                                  .height(82.dp),
                                              fillColor = optTokens.paper,
                                              borderColor = tokens.ink,
                                              shadowColor = tokens.ink,
                                              cornerRadius = 10.dp,
                                              borderWidth = 2.dp,
                                              shadowOffset = 4.dp,
                                              isSelectedOrPressedPermanently = isSelected,
