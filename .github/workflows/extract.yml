name: Extract source files
on: workflow_dispatch
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        run: |
          echo "Files in repo:"
          find . -path ./.git -prune -o -type f -print
          SRC=$(grep -rl "rootProject.name" --exclude-dir=.git . | head -1)
          if [ -z "$SRC" ]; then
            echo "ERROR: could not find your source file in the repo"
            exit 1
          fi
          echo "Using: $SRC"
          awk '
          /^ *cat << .EOF. > / {
            ind = match($0, /[^ ]/) - 1
            match($0, /> [^ ]+$/)
            out = substr($0, RSTART + 2)
            dir = out
            if (sub(/\/[^\/]*$/, "", dir)) system("mkdir -p " dir)
            printf "" > out
            inblk = 1
            next
          }
          inblk && /^ *EOF$/ { close(out); inblk = 0; next }
          inblk {
            line = $0
            pad = sprintf("%" ind "s", "")
            if (ind > 0 && substr(line, 1, ind) == pad) line = substr(line, ind + 1)
            print line > out
          }
          ' "$SRC"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Extract source files"
          git push
