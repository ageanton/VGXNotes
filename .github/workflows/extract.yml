name: Extract source files
on: workflow_dispatch
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        run: |
          awk '
          /^ *cat << .EOF. > / {
            match($0, /> [^ ]+$/)
            out = substr($0, RSTART + 2)
            dir = out
            if (sub(/\/[^\/]*$/, "", dir)) system("mkdir -p " dir)
            printf "" > out
            inblk = 1
            next
          }
          inblk && /^ *EOF$/ { close(out); inblk = 0; next }
          inblk {
            line = $0
            if (substr(line, 1, 10) == "          ") line = substr(line, 11)
            print line > out
          }
          ' vgx_source.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Extract source files"
          git push
